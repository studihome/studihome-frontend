        }

        /* Gradient Button Themes */
        .btn-brand-gradient {
            background: linear-gradient(135deg, #151c75 0%, #3f48bf 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(21, 28, 117, 0.25);
            transition: all 0.2s ease;
        }

        .btn-brand-gradient:hover {
            box-shadow: 0 6px 18px rgba(21, 28, 117, 0.38);
            transform: translateY(-1px);
        }

        .btn-brand-amber {
            background: linear-gradient(135deg, #EAB308 0%, #F59E0B 100%);
            color: #0F172A;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.3);

        }

        .bg-footer-gradient {
            background: linear-gradient(135deg, #151c75 0%, #3f48bf 100%);
        }

        /* Testimonial Transitions */
        .testimonial-fade {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        .testimonial-fade-out {
            opacity: 0;
            transform: translateY(10px) scale(0.98);
        }
        .testimonial-fade-in {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Smooth Slow Spin Animation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 16s linear infinite;
        }

        /* Marquee Animation Left-to-Right */
        @keyframes marqueeLtr {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
        .animate-marquee-ltr {
            display: flex;
            width: 200%;
            animation: marqueeLtr 22s linear infinite;
        }
        .animate-marquee-ltr:hover {
            animation-play-state: paused;
        }

        /* Chat Speech Bubble Tails */
        .chat-bubble-left::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 28px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 12px 0 0;
            border-color: #ffffff transparent transparent transparent;
            filter: drop-shadow(2px 2px 2px rgba(15, 23, 42, 0.08));

        .chat-bubble-right::before {
            content: '';

            bottom: -10px;

                    }
                },
                set: (key, value) => {
                    try {
                        localStorage.setItem(key, value);
                        return true;
                    } catch (e) {
                        return false;
                    }
                },
                remove: (key) => {
                    try {
                        localStorage.removeItem(key);

                post: async (action, payload = {}) => {

                    if (isDemo) {
                        App.ui.updateApiStatus('ready');
                        await new Promise(r => setTimeout(r, 100));
                        return App.api.getMockData(action, payload);
                    }

                    App.ui.updateApiStatus('connecting');

                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 12000);

                        const response = await fetch(API_BASE_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action, payload, token: App.state.user?.token }),
                            signal: controller.signal
                        });
                        
                        clearTimeout(timeoutId);
                        const text = await response.text();
                        let result;
                        
                        try {
                            result = JSON.parse(text);
                        } catch (parseErr) {
                            throw new Error("Respon server bukan format JSON valid.");
                        }

                        if (!result.success) {
                            throw new Error(result.error?.message || result.error || 'Terjadi kesalahan pada server Apps Script.');
                        }

                        App.ui.updateApiStatus('online');
                        return result.data;
                    } catch (e) {
                        App.ui.updateApiStatus('error');
                        App.ui.toast("Koneksi Backend Gagal: " + e.message, "error");
                        throw e;
                    }
                }

                    const rForm = document.getElementById('register-form');
                    const title = document.getElementById('auth-modal-title');
                    if (mode === 'register') {
                        lForm.classList.add('hidden');
                        rForm.classList.remove('hidden');
                        title.textContent = 'Pendaftaran Akun Baru';
                    } else {
                        rForm.classList.add('hidden');
                        lForm.classList.remove('hidden');
                        title.textContent = 'Masuk ke Studihome';
                    }
                },

                handleLogin: async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;

                    try {
                        const res = await App.api.post('AUTH_LOGIN', { email, password });
                        const userData = res.user || res;
                        
                        App.state.user = userData;
                        if (res.token) App.state.user.token = res.token;

                        App.storage.set('studihome_session', JSON.stringify(App.state.user));
                        App.ui.renderTopAuth();
                        App.ui.toggleModal('auth-modal', false);
                        App.ui.toast(`Selamat datang kembali, ${userData.name}!`, 'success');

                        if (App.state.pendingCheckoutProductId) {
                            const pId = App.state.pendingCheckoutProductId;
                            App.state.pendingCheckoutProductId = null;
                            App.shop.startCheckout(pId);
                        } else {
                            if (userData.role === 'admin') App.router.navigate('admin');
                            else App.router.navigate('dashboard');
                        }
                    } catch (err) {
                        App.ui.toast(err.message || "Gagal masuk ke akun.", "error");
                    }
                },

                handleRegister: async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('reg-name').value;
                    const email = document.getElementById('reg-email').value;
                    const phone = document.getElementById('reg-phone').value;
                    const password = document.getElementById('reg-password').value;

                    if (!phone || phone.trim() === '') {
                        App.ui.toast('WhatsApp wajib diisi!', 'error');
                        return;
                    }

                    if (password.length < 10) {
                        App.ui.toast('Kata sandi minimal 10 karakter!', 'error');
                        return;
                    }

                    try {
                        const res = await App.api.post('AUTH_REGISTER', { name, email, phone, password });
                        const userData = res.user || res;

                        App.state.user = userData;
                        if (res.token) App.state.user.token = res.token;

                        App.storage.set('studihome_session', JSON.stringify(App.state.user));
                        App.ui.renderTopAuth();
                        App.ui.toggleModal('auth-modal', false);
                        App.ui.toast('Akun berhasil dibuat!', 'success');

                        if (App.state.pendingCheckoutProductId) {
                            const pId = App.state.pendingCheckoutProductId;
                            App.state.pendingCheckoutProductId = null;
                            App.shop.startCheckout(pId);
                        } else {
                            App.router.navigate('dashboard');
                        }
                    } catch (err) {
                        App.ui.toast(err.message || "Gagal mendaftar.", "error");
                    }
                },

                logout: async () => {
                    if (API_BASE_URL && API_BASE_URL.trim() !== '' && App.state.user?.token) {
                        try { await App.api.post('AUTH_LOGOUT'); } catch (e) {}
                    }
                    App.state.user = null;
                    App.storage.remove('studihome_session');
                    App.ui.renderTopAuth();
                    App.ui.toast('Anda telah keluar.', 'info');
                    App.router.navigate('home');
                }
            },

                load: async () => {
                    try {
                        App.state.publicData = await App.api.post('GET_PUBLIC');
                        App.home.startTestimonialCycle();

                        return;

                handleCtaClick: (targetUrl) => {
                    if (!targetUrl) {
                        App.router.navigate('products');
                        return;
                    }

                    if (targetUrl.startsWith('#')) {
                        const target = targetUrl.replace('#', '');
                        if (target.startsWith('checkout-') || target.startsWith('p')) {
                            const productId = target.replace('checkout-', '');
                            App.shop.startCheckout(productId);
                        } else {
                            App.router.navigate(target);
                        }
                    } else {
                        window.open(targetUrl, '_blank', 'noopener,noreferrer');
                    }
                },

                    if (App.state.leftTestimonialTimer) clearInterval(App.state.leftTestimonialTimer);
                    if (App.state.rightTestimonialTimer) clearInterval(App.state.rightTestimonialTimer);

                    App.state.leftTestimonialTimer = setInterval(() => {
                        const data = App.state.publicData || App.api.getMockData('GET_PUBLIC');
                        const testimonials = data.testimonials || App.state.demo.testimonials;
                        if (testimonials.length > 0) {
                            App.state.leftIndex = (App.state.leftIndex + 1) % testimonials.length;
                            App.home.animateTestimonialChange('testimonial-card-left', testimonials[App.state.leftIndex]);
                        }

                    App.state.rightTestimonialTimer = setInterval(() => {
                        const data = App.state.publicData || App.api.getMockData('GET_PUBLIC');
                        const testimonials = data.testimonials || App.state.demo.testimonials;
                        if (testimonials.length > 0) {

                    document.getElementById('ai-link-index').value = index;
                    
                    if (index >= 0 && aiLinks[index]) {
                        document.getElementById('ai-link-modal-title').textContent = "Edit Tautan AI";
                        document.getElementById('ai-link-name').value = aiLinks[index].name;
                        document.getElementById('ai-link-icon').value = aiLinks[index].icon;
                    } else {
                        document.getElementById('ai-link-modal-title').textContent = "Tambah Tautan AI";
                        document.getElementById('ai-link-name').value = "";
                        document.getElementById('ai-link-icon').value = "fa-solid fa-robot text-emerald-500";
                    }
                    App.ui.toggleModal('ai-link-modal', true);
                },

                saveAiLinkFromModal: async (e) => {
                    e.preventDefault();
                    const index = parseInt(document.getElementById('ai-link-index').value, 10);
                    const name = document.getElementById('ai-link-name').value;
                    const icon = document.getElementById('ai-link-icon').value;

                    const current = App.state.demo.aiLinks || [];
                    if (index >= 0 && index < current.length) {
                        current[index] = { name, icon };
                    } else {
                        current.push({ name, icon });
                    }

                    await App.api.post('ADMIN_SAVE_AI_LINKS', { aiLinks: current });
                    App.ui.toggleModal('ai-link-modal', false);
                    App.ui.toast('Tautan Marquee AI berhasil disimpan!', 'success');
                    App.admin.renderSubTab();
                },

                deleteAiLink: async (index) => {
                    const current = App.state.demo.aiLinks || [];
                    current.splice(index, 1);
                    await App.api.post('ADMIN_SAVE_AI_LINKS', { aiLinks: current });
                    App.ui.toast('Link AI dihapus.', 'info');
                    App.admin.renderSubTab();
                },

                showTestimonialForm: (editId = null) => {
                    const box = document.getElementById('testimonial-form-box');
                    box.classList.remove('hidden');

                    let t = { name: '', role: '', text: '' };
                    if (editId) {
                        const found = App.state.demo.testimonials.find(item => item.id === editId);
                        if (found) t = found;
                    }

                    box.innerHTML = `
                        <h5 class="font-bold text-xs text-[#151c75] mb-2">${editId ? 'Edit Testimoni' : 'Tambah Testimoni'}</h5>
                        <form onsubmit="App.admin.saveTestimonial(event, '${editId || ''}')" class="space-y-2">
                            <input type="text" id="t-name" required value="${App.utils.escapeHtml(t.name)}" placeholder="Nama Pengguna" class="w-full card-3d-inset px-3 py-1.5 rounded-xl text-xs">
                            <input type="text" id="t-role" required value="${App.utils.escapeHtml(t.role)}" placeholder="Profesi / Peran" class="w-full card-3d-inset px-3 py-1.5 rounded-xl text-xs">
                            <textarea id="t-text" required placeholder="Isi Ulasan / Testimoni" class="w-full card-3d-inset px-3 py-1.5 rounded-xl text-xs h-16">${App.utils.escapeHtml(t.text)}</textarea>
                            <div class="flex items-center gap-2 pt-1">
                                <button type="submit" class="btn-brand-gradient px-3 py-1 rounded-xl text-xs font-bold">Simpan</button>
                                <button type="button" onclick="document.getElementById('testimonial-form-box').classList.add('hidden')" class="px-3 py-1 rounded-xl text-xs font-bold text-slate-600 bg-slate-200">Batal</button>
                            </div>
                        </form>
                    `;
                },

                saveTestimonial: async (e, editId = '') => {
                    e.preventDefault();
                    const testimonial = {
                        id: editId || undefined,
                        name: document.getElementById('t-name').value,
                        role: document.getElementById('t-role').value,
                        text: document.getElementById('t-text').value
                    };
                    await App.api.post('ADMIN_SAVE_TESTIMONIAL', { testimonial });
                    App.ui.toast('Testimoni berhasil disimpan!', 'success');
                    App.admin.renderSubTab();
                },

                deleteTestimonial: async (testimonialId) => {
                    await App.api.post('ADMIN_DELETE_TESTIMONIAL', { testimonialId });
                    App.ui.toast('Testimoni dihapus.', 'info');
                    App.admin.renderSubTab();
                },

                saveMasterQRIS: async () => {
                    const slots = [];
                    for (let i = 1; i <= 6; i++) {
                        slots.push({
                            slot: i,
                            name: document.getElementById(`qris-name-${i}`).value,
                            price: Number(document.getElementById(`qris-price-${i}`).value),
                            qrisUrl: document.getElementById(`qris-url-${i}`).value
                        });
                    }
                    await App.api.post('ADMIN_SAVE_MASTER', { qrisSlots: slots });
                    App.ui.toast('Harga QRIS & Master Data tersimpan!', 'success');
                },

                toggleUserStatus: async (userId) => {
                    await App.api.post('ADMIN_TOGGLE_USER_STATUS', { userId });
                    App.ui.toast('Status pengguna berhasil diperbarui.', 'info');
                    App.admin.renderSubTab();
                }
            },

            shop: {
                claimFreeProduct: async (productId) => {
                    if (!App.state.user) {
                        App.state.pendingCheckoutProductId = productId;
                        App.ui.toast('Silakan masuk atau daftar akun terlebih dahulu untuk klaim produk gratis ini.', 'info');
                        App.ui.toggleModal('auth-modal', true);
                        return;
                    }

                    try {
                        await App.api.post('CLAIM_FREE_PRODUCT', { productId });
                        App.ui.toast('Produk GRATIS berhasil ditambahkan ke Dashboard Anda!', 'success');
                        App.router.navigate('dashboard');
                    } catch (e) {
                        App.ui.toast('Gagal menambahkan produk gratis.', 'error');
                    }
                },

                startCheckout: (productId) => {
                    const data = App.state.publicData || App.api.getMockData('GET_PUBLIC');
                    const product = (data.products || []).find(p => p.id === productId);

                    if (!product) {
                        App.ui.toast('Produk tidak ditemukan.', 'error');
                        return;
                    }

                    if (!App.state.user) {
                        App.state.pendingCheckoutProductId = productId;
                        App.ui.toast('Silakan masuk atau daftar akun terlebih dahulu untuk mendapatkan produk ini.', 'info');
                        App.ui.toggleModal('auth-modal', true);
                        return;
                    }

                    const status = App.products.getUserProductStatus(productId);
                    if (status === 'OWNED') {
                        App.ui.toast('Anda sudah memiliki produk ini. Membuka modul...', 'info');
                        App.dashboard.openModulePlayer(productId);
                        return;
                    } else if (status === 'PENDING') {
                        App.ui.toast('Anda sudah memiliki pesanan pending untuk produk ini. Silakan tunggu verifikasi admin.', 'info');
                        App.router.navigate('dashboard');
                        return;
                    }

                    if (product.isFree || product.price === 0) {
                        App.shop.claimFreeProduct(productId);
                        return;
                    }

                    App.state.checkout.product = product;
                    App.state.checkout.step = 1;
                    App.shop.renderCheckout();
                    App.ui.toggleModal('checkout-modal', true);
                },

                generateWaUrl: (userName, orderId, productTitle, price) => {
                    const phoneWA = "6285111581115";
                    const message = `Halo Admin Studihome, saya ingin konfirmasi pembayaran:%0A%0A` +
                        `• *Nama Member:* ${encodeURIComponent(userName)}%0A` +
                        `• *ID Order:* ${encodeURIComponent(orderId)}%0A` +
                        `• *Nama Produk:* ${encodeURIComponent(productTitle)}%0A` +
                        `• *Harga Produk:* Rp ${Number(price).toLocaleString('id-ID')}%0A%0A` +
                        `Mohon verifikasi pembayaran dan buka akses modul saya. Terima kasih!`;
                    return `https://wa.me/${phoneWA}?text=${message}`;
                },

                renderCheckout: () => {
                    const container = document.getElementById('checkout-modal-content');
                    const p = App.state.checkout.product;
                    const step = App.state.checkout.step;

                    if (step === 1) {
                        container.innerHTML = `
                            <h3 class="text-base sm:text-lg font-extrabold text-[#151c75] mb-2">Formulir Pemesanan Studihome</h3>
                            <div class="card-3d-inset p-3.5 rounded-2xl mb-4">
                                <span class="text-[10px] font-bold text-amber-600 uppercase">PRODUK DIPILIH</span>
                                <h4 class="font-bold text-sm text-[#151c75]">${App.utils.escapeHtml(p.title)}</h4>
                                <span class="font-black text-xs text-[#151c75]">Rp ${Number(p.price).toLocaleString('id-ID')}</span>
                            </div>
                            <form onsubmit="App.shop.submitOrderStep1(event)" class="space-y-3.5">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Member</label>
                                    <input type="text" id="co-name" required value="${App.state.user?.name || ''}" class="w-full card-3d-inset px-3.5 py-2.5 rounded-xl text-xs sm:text-sm outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp <span class="text-red-500">*</span></label>
                                    <input type="tel" id="co-phone" required value="${App.state.user?.phone || ''}" class="w-full card-3d-inset px-3.5 py-2.5 rounded-xl text-xs sm:text-sm outline-none">
                                </div>
                                <button type="submit" class="w-full btn-brand-gradient py-3 rounded-xl text-xs sm:text-sm font-bold">
                                    Lanjut ke Pembayaran QRIS <i class="fa-solid fa-arrow-right ml-1 text-[#FACC15]"></i>
                                </button>
                            </form>
                        `;
                    } else if (step === 2) {
                        const qrisUrl = App.state.demo.master?.qrisSlots[0]?.qrisUrl || 'https://placehold.co/300x300/151c75/ffffff?text=QRIS+STUDIHOME';
                        const userName = App.state.user?.name || 'Pelanggan';
                        const waUrl = App.shop.generateWaUrl(userName, App.state.checkout.orderId, p.title, p.price);

                        container.innerHTML = `
                            <div class="text-center space-y-3.5">
                                <h3 class="text-base sm:text-lg font-bold text-[#151c75]">Pembayaran QRIS Studihome</h3>
                                <p class="text-xs text-slate-500">Scan QRIS di bawah ini melalui BCA, Mandiri, BRI, GoPay, Dana, OVO, atau ShopeePay</p>
                                
                                <div class="card-3d p-3.5 rounded-2xl inline-block mx-auto bg-white border border-slate-200">
                                    <img src="${qrisUrl}" alt="QRIS Studihome" class="w-44 h-44 sm:w-48 sm:h-48 mx-auto rounded-xl object-contain">
                                </div>

                                <div class="card-3d-inset p-3 rounded-xl text-left text-xs space-y-1">
                                    <div class="flex justify-between">
                                        <span class="text-slate-500">ID Order:</span>
                                        <span class="font-bold font-mono text-[#151c75]">${App.state.checkout.orderId}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-500">Total Tagihan:</span>
                                        <span class="font-black text-[#151c75]">Rp ${Number(p.price).toLocaleString('id-ID')}</span>
                                    </div>
                                </div>

                                <div class="pt-1">
                                    <button onclick="App.shop.confirmAndOpenWa('${waUrl}')" class="w-full py-3 rounded-xl text-xs sm:text-sm font-extrabold text-white bg-emerald-600 hover:bg-emerald-700 flex items-center justify-center gap-2 shadow-md transition-all">
                                        <i class="fa-brands fa-whatsapp text-base"></i> Konfirmasi Pembayaran
                                    </button>
                                    <p class="text-[10px] text-slate-500 mt-2">Konfirmasi Lebih Cepat dengan Hubungi Admin</p>
                                </div>
                            </div>
                        `;
                    }
                },

                submitOrderStep1: async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('co-name').value;
                    const phone = document.getElementById('co-phone').value;

                    try {
                        const res = await App.api.post('CREATE_ORDER', {
                            productId: App.state.checkout.product.id,
                            name,
                            phone
                        });
                        App.state.checkout.orderId = res.orderId || ('ORD-' + Math.floor(100000 + Math.random() * 900000));
                        App.state.checkout.step = 2;
                        App.shop.renderCheckout();
                    } catch (err) {}
                },

                confirmAndOpenWa: (waUrl) => {
                    window.open(waUrl, '_blank', 'noopener,noreferrer');
                    App.ui.toggleModal('checkout-modal', false);
                    App.ui.toast('Pesanan dicatat! Produk Anda berada dalam status TERKUNCI sampai disetujui Admin.', 'info');
                    App.router.navigate('dashboard');
                }
            },

            utils: {
                updateClock: () => {
                    const el = document.getElementById('live-clock');
                    if (!el) return;
                    const now = new Date();
                    el.textContent = now.toTimeString().split(' ')[0];
                },

                escapeHtml: (str) => {
                    if (!str) return '';
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }
            }
        };

        window.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
