  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
      });
    })();
  </script>
  <style>
      .sh-pwa-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(2,6,23,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:'Inter',system-ui,sans-serif}
      .sh-pwa-overlay.show{display:flex}
      .sh-pwa-card{position:relative;width:min(400px,calc(100vw - 2rem));background:#fff;border-radius:1.5rem;box-shadow:0 25px 60px rgba(21,28,117,.25);overflow:hidden;animation:shPwaIn .35s cubic-bezier(.22,.9,.3,1)}
      .sh-pwa-header{background:linear-gradient(135deg,#151c75,#3f48bf);padding:2rem 1.5rem 1.5rem;text-align:center}
      .sh-pwa-star{width:64px;height:64px;margin:0 auto 1rem;border-radius:1.25rem;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#FACC15;box-shadow:0 8px 24px rgba(21,28,117,.3)}
      .sh-pwa-title{color:#fff;font-size:18px;font-weight:900;line-height:1.2}
      .sh-pwa-sub{color:rgba(255,255,255,.75);font-size:12px;margin-top:.35rem}
      .sh-pwa-body{padding:1.25rem 1.5rem}
      .sh-pwa-benefits{display:grid;gap:.6rem;margin-bottom:1.25rem}
      .sh-pwa-benefit{display:flex;align-items:center;gap:.6rem;font-size:12px;color:#475569;line-height:1.4}
      .sh-pwa-benefit i{color:#151c75;font-size:14px;width:18px;text-align:center;flex-shrink:0}
      .sh-pwa-actions{display:flex;gap:.5rem}
      .sh-pwa-btn-install{flex:1;padding:.75rem;border:none;border-radius:.875rem;background:linear-gradient(135deg,#EAB308,#F59E0B);color:#0F172A;font-weight:900;font-size:13px;cursor:pointer;transition:box-shadow .2s,transform .15s;box-shadow:0 4px 14px rgba(234,179,8,.25)}
      .sh-pwa-btn-install:hover{box-shadow:0 6px 20px rgba(234,179,8,.4);transform:translateY(-1px)}
      .sh-pwa-btn-dismiss{padding:.75rem 1rem;border:1px solid #e2e8f0;border-radius:.875rem;background:#f8fafc;color:#64748b;font-weight:700;font-size:12px;cursor:pointer;transition:background .15s}
      .sh-pwa-btn-dismiss:hover{background:#f1f5f9}
      .sh-pwa-ios-note{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:.75rem;padding:.75rem;font-size:11px;color:#1e40af;line-height:1.6}
      .sh-pwa-ios-note b{font-weight:800}
      @keyframes shPwaIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
      @media(prefers-reduced-motion:reduce){.sh-pwa-card{animation:none}}
    </style>
    <script>
      (function () {
        var el;
        var autoTimer;
        var autoHideTimer;
        var lastObservedPath = window.location.pathname || '/';
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isSafari = /Safari/i.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|SamsungBrowser/i.test(ua);
        var isChromiumLike = /Chrome|Chromium|CriOS|Edg|OPR|SamsungBrowser/i.test(ua);
        var DISMISS_KEY = 'studihome-pwa-dismissed-v2';
        var LAST_AUTO_KEY = 'studihome-pwa-auto-shown-v1';
        var SESSION_KEY = 'studihome-pwa-auto-session-v1';
        var INSTALLED_KEY = 'studihome-pwa-installed-v1';
        var DISMISS_TTL = 7 * 24 * 60 * 60 * 1000;
        var AUTO_REMINDER_TTL = 3 * 24 * 60 * 60 * 1000;
        var INSTALLED_TTL = 30 * 24 * 60 * 60 * 1000;
        var AUTO_HIDE_MS = 14 * 1000;

        function readTimestamp(key, storage) {
          try {
            var raw = storage.getItem(key);
            var value = Number(raw || 0);
            return Number.isFinite(value) ? value : 0;
          } catch (_) { return 0; }
        }

        function writeTimestamp(key, storage) {
          try { storage.setItem(key, String(Date.now())); } catch (_) {}
        }

        function isInstalled() {
          if (window.navigator.standalone) return true;
          if (window.matchMedia('(display-mode: standalone)').matches) return true;
          var installedAt = readTimestamp(INSTALLED_KEY, localStorage);
          return installedAt > 0 && (Date.now() - installedAt) < INSTALLED_TTL;
        }

        function isInstallGuidanceSupported() {
          return isIOS || isSafari || isChromiumLike;
        }

        function isDismissed() {
          if (isInstalled()) return true;
          var dismissedAt = readTimestamp(DISMISS_KEY, localStorage);
          return dismissedAt > 0 && (Date.now() - dismissedAt) < DISMISS_TTL;
        }

        function wasRecentlyAutoShown() {
          if (isInstalled()) return true;
          try {
            if (sessionStorage.getItem(SESSION_KEY) === '1') return true;
          } catch (_) {}
          var lastAuto = readTimestamp(LAST_AUTO_KEY, localStorage);
          return lastAuto > 0 && (Date.now() - lastAuto) < AUTO_REMINDER_TTL;
        }

        function markAutoShown() {
          writeTimestamp(LAST_AUTO_KEY, localStorage);
          try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (_) {}
        }

        function dismiss() {
          writeTimestamp(DISMISS_KEY, localStorage);
          hide();
        }

        function guidanceHtml() {
          if (isIOS) {
            return '<div class="sh-pwa-ios-note">Di iPhone/iPad, gunakan <b>Safari</b>: ketuk <b>Bagikan ↑</b> → <b>Tambah ke Layar Utama</b>, aktifkan <b>Buka sebagai App Web</b>, lalu ketuk <b>Tambah</b>.</div>';
          }
          if (isSafari) {
            return '<div class="sh-pwa-ios-note">Di Safari Mac, pilih <b>File → Tambahkan ke Dock</b> atau <b>Bagikan → Tambahkan ke Dock</b>.</div>';
          }
          return '<div class="sh-pwa-ios-note">Gunakan ikon <b>Install</b> di address bar atau menu browser, lalu pilih <b>Instal aplikasi</b> / <b>Tambahkan ke layar utama</b>.</div>';
        }

        function delayForPath(pathname) {
          var path = String(pathname || '/').toLowerCase().replace(/\/{2,}/g, '/').replace(/\/$/, '') || '/';
          if (path === '/admin' || path.startsWith('/admin/') || path === '/reset-password') return null;
          if (path === '/') return 18 * 1000;
          if (path === '/studio-ai' || /^\/(?:ai-|kursus-ai|jasa-ai|ai-untuk-)/.test(path)) return 24 * 1000;
          if (path === '/dapur' || path.startsWith('/dapur/')) return 45 * 1000;
          return 45 * 1000;
        }

        function show(options) {
          options = options || {};
          if (!isInstallGuidanceSupported() || isInstalled()) return false;
          if (!options.force && isDismissed()) return false;
          if (options.auto && wasRecentlyAutoShown()) return false;
          if (!el) el = build();
          if (!el) return false;
          el.classList.add('show');
          el.setAttribute('aria-hidden', 'false');
          if (options.auto) {
            markAutoShown();
            clearTimeout(autoHideTimer);
            autoHideTimer = setTimeout(hide, AUTO_HIDE_MS);
          }
          return true;
        }

        function hide() {
          clearTimeout(autoHideTimer);
          if (el) {
            el.classList.remove('show');
            el.setAttribute('aria-hidden', 'true');
          }
        }

        function scheduleAuto(delayOverride) {
          clearTimeout(autoTimer);
          if (!isInstallGuidanceSupported() || isInstalled() || isDismissed() || wasRecentlyAutoShown()) return;
          var path = window.location.pathname || '/';
          var delay = typeof delayOverride === 'number' ? delayOverride : delayForPath(path);
          if (delay === null) return;
          autoTimer = setTimeout(function () {
            if ((window.location.pathname || '/') !== path) {
              observeRouteChange();
              return;
            }
            if (document.visibilityState === 'hidden') return;
            show({ auto: true });
          }, delay);
        }

        function observeRouteChange() {
          var path = window.location.pathname || '/';
          if (path === lastObservedPath) return;
          lastObservedPath = path;
          scheduleAuto();
        }

        function build() {
          el = document.createElement('div');
          el.className = 'sh-pwa-overlay';
          el.setAttribute('role', 'dialog');
          el.setAttribute('aria-modal', 'true');
          el.setAttribute('aria-labelledby', 'sh-pwa-title');
          el.setAttribute('aria-hidden', 'true');

          var benefits = '<div class="sh-pwa-benefits">'
            + '<div class="sh-pwa-benefit"><i class="fa-solid fa-bolt"></i>Akses instan dari home screen</div>'
            + '<div class="sh-pwa-benefit"><i class="fa-solid fa-wifi-slash"></i>Bisa dipakai meski offline</div>'
            + '<div class="sh-pwa-benefit"><i class="fa-solid fa-shield-halved"></i>Pengalaman lebih cepat & ringan</div>'
            + '</div>';

          el.innerHTML = '<div class="sh-pwa-card">'
            + '<div class="sh-pwa-header">'
            + '<div class="sh-pwa-star">✦</div>'
            + '<div id="sh-pwa-title" class="sh-pwa-title">Instal Studihome</div>'
            + '<div class="sh-pwa-sub">Lebih cepat dibuka, lebih nyaman dipakai</div>'
            + '</div>'
            + '<div class="sh-pwa-body">'
            + benefits + guidanceHtml()
            + '<div class="sh-pwa-actions" style="margin-top:.75rem">'
            + '<button class="sh-pwa-dismiss" style="flex:1">Nanti saja</button>'
            + '</div></div></div>';

          document.body.appendChild(el);
          el.addEventListener('click', function (event) {
            if (event.target === el) dismiss();
          });
          el.querySelector('.sh-pwa-dismiss').onclick = dismiss;
          return el;
        }

        window.addEventListener('appinstalled', function () {
          writeTimestamp(INSTALLED_KEY, localStorage);
          hide();
        });

        window.addEventListener('load', function () { scheduleAuto(); });
        window.addEventListener('popstate', function () { setTimeout(observeRouteChange, 0); }, { passive: true });
        window.addEventListener('hashchange', function () { setTimeout(observeRouteChange, 0); }, { passive: true });
        document.addEventListener('click', function () { setTimeout(observeRouteChange, 120); }, { passive: true });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && !wasRecentlyAutoShown()) scheduleAuto(5 * 1000);
        });

        window.StudihomePWA = Object.assign(window.StudihomePWA || {}, {
          show: function () { return show({ force: true }); },
          hide: hide,
          schedule: scheduleAuto,
          isInstalled: isInstalled,
          usesNativeInstallUI: true,
          noticePolicy: {
            homeDelayMs: 18 * 1000,
            studioDelayMs: 24 * 1000,
            contentDelayMs: 30 * 1000,
            privateDelayMs: 45 * 1000,
            autoHideMs: AUTO_HIDE_MS,
            reminderTtlMs: AUTO_REMINDER_TTL,
            dismissTtlMs: DISMISS_TTL
          }
        });

      })();
    </script>
