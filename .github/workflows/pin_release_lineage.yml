name: pin-release-lineage
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  pin:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update release lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dep = 'dpl_5goqrmzUamPSjEnHHRXTpsXqSzBd'
          p = Path('MASTER_HANDOFF_PROMPT_STUDIHOME.md')
          s = p.read_text()
          s = s.replace('Production deployment:\n`dpl_GfX5GYb1tKeCWHNtpbFjSfrqfZ9T`', 'Latest Production deployment (documentation-lineage commit):\n`'+dep+'`')
          s = s.replace('Production deployment:\n`dpl_GfX5GYb1tKeCWHNtpbFjSfrqfZ9T`', 'Latest Production deployment (documentation-lineage commit):\n`'+dep+'`')
          p.write_text(s)
          p = Path('PROJECT_CONSTITUTION.md')
          s = p.read_text()
          s = s.replace('That source was deployed successfully to Production as:\n`dpl_GfX5GYb1tKeCWHNtpbFjSfrqfZ9T`', 'That functional source was deployed successfully to Production as:\n`dpl_GfX5GYb1tKeCWHNtpbFjSfrqfZ9T`\n\nLatest Production deployment, including documentation-only lineage updates:\n`'+dep+'`')
          p.write_text(s)
          PY
          rm -f .github/workflows/pin_release_lineage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_HANDOFF_PROMPT_STUDIHOME.md PROJECT_CONSTITUTION.md .github/workflows/pin_release_lineage.yml
          git commit -m 'docs: pin latest production deployment lineage'
          git push origin main
