name: Fix Dapur username redirect
on:
  push:
    branches: [feat/studio-ai-creator-card-dapur-profile-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch redirect and validate
        shell: python
        run: |
          from pathlib import Path
          p=Path('dapur-profile-enhancements.js')
          s=p.read_text(encoding='utf-8')
          old="t('Profil berhasil diperbarui. ✨','success');close();setTimeout(()=>location.reload(),350)"
          new="t('Profil berhasil diperbarui. ✨','success');close();setTimeout(()=>{location.href=(!lock&&nu!==x.username)?'/dapur/'+encodeURIComponent(nu):location.href},350)"
          if s.count(old)!=1: raise SystemExit('Expected exactly one redirect target')
          p.write_text(s.replace(old,new),encoding='utf-8')
          import subprocess
          r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('Syntax check failed')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-dapur-username-redirect.yml
          git add dapur-profile-enhancements.js
          git diff --cached --check
          git commit -m "fix(dapur): redirect to new username after change"
          git push