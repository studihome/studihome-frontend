name: One-time load unified Dapur Creator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'studihome' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Attach unified Dapur Creator module
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'admin-dapur-creator-merged.js?v=1'
          script = '<script src="/admin-dapur-creator-merged.js?v=1" defer></script>'
          if marker not in text:
              close_body = text.lower().rfind('</body>')
              if close_body == -1:
                  raise SystemExit('index.html has no </body>; aborting without changes.')
              text = text[:close_body] + script + '\n' + text[close_body:]
              path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/one-time-load-merged-dapur-creator.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-load-merged-dapur-creator.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: unify Admin Creator and Dapur into Dapur Creator"
          git push origin HEAD:main
