              if [ -z "$unsafe" ]; then
                deployed_source_sha="$candidate"
                binding="runtime-equivalent-vercel-ancestor"
                break
              fi
            done

            if [ -n "$deployed_source_sha" ]; then
              break
            fi
            echo "Vercel source not ready yet (attempt $readiness_attempt/30)"
