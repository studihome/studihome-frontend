name: Studihome Preview Browser Acceptance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - index.html
      - 'static-*-actions.js'
      - 'generated-*-actions.js'
      - scripts/preview-browser-acceptance.py
      - .github/workflows/preview-browser-acceptance.yml
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel Preview URL (https://*.vercel.app)
        required: true
        type: string
      expected_sha:
        description: Expected 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: read

concurrency:
  group: studihome-preview-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MANUAL_PREVIEW_URL: ${{ inputs.preview_url }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Preview browser harness self-test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/preview-browser-acceptance.py
          python3 scripts/preview-browser-acceptance.py --self-test

      - name: Resolve exact-head Vercel Preview
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected SHA is invalid: $EXPECTED_SHA" >&2
            exit 1
          fi

          manual_preview=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            manual_preview="$MANUAL_PREVIEW_URL"
          fi

          for attempt in $(seq 1 60); do
            preview="$manual_preview"

            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status"               > /tmp/studihome-vercel-status.json
            vercel_state="$(python3 - /tmp/studihome-vercel-status.json <<'PY'
import json
import sys

with open(sys.argv[1], encoding='utf-8') as handle:
    payload = json.load(handle)

statuses = [
    item for item in payload.get('statuses', [])
    if str(item.get('context', '')).lower() == 'vercel'
]
print(str(statuses[0].get('state', '')) if statuses else '')
PY
)"

            if [ -z "$preview" ] && [ -n "${PR_NUMBER:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"                 > /tmp/studihome-pr-comments.json
              preview="$(python3 - /tmp/studihome-pr-comments.json <<'PY'
import json
import re
import sys

with open(sys.argv[1], encoding='utf-8') as handle:
    comments = json.load(handle)

urls = []
for comment in comments:
    if comment.get('user', {}).get('login') != 'vercel[bot]':
        continue
    match = re.search(r'\[Preview\]\((https://[^)]+)\)', str(comment.get('body', '')))
    if match:
        urls.append(match.group(1))

print(urls[-1] if urls else '')
PY
)"
            fi

            if [[ "$preview" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] && [ "$vercel_state" = "success" ]; then
              preview="${preview%/}"
              version_state="unavailable"
              deployed_sha=""

              if curl -fsS --max-time 15 "$preview/api/version"                 > /tmp/studihome-preview-version 2>/dev/null; then
                readarray -t version_fields < <(python3 - /tmp/studihome-preview-version <<'PY'
import json
import sys

try:
    with open(sys.argv[1], encoding='utf-8') as handle:
        payload = json.load(handle)
except Exception:
    print('')
    print('non-json')
else:
    print(str(payload.get('commit') or ''))
    print(str(payload.get('status') or ''))
PY
)
                deployed_sha="${version_fields[0]:-}"
                version_state="${version_fields[1]:-}"
              fi

              if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$EXPECTED_SHA" ]; then
                echo "Preview alias still reports $deployed_sha; waiting for $EXPECTED_SHA (attempt $attempt/60)."
              else
                if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
                  echo "Exact-head Preview verified by Vercel status + /api/version: $preview"
                  echo "PREVIEW_BINDING=version-endpoint" >> "$GITHUB_ENV"
                else
                  echo "Exact-head Vercel commit status is SUCCESS; /api/version is $version_state."
                  echo "Browser acceptance will fail closed if the Preview alias is not the Studihome app."
                  echo "PREVIEW_BINDING=vercel-commit-status" >> "$GITHUB_ENV"
                fi
                echo "PREVIEW_URL=$preview" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              echo "Waiting for Vercel exact-head SUCCESS + Preview URL (state=${vercel_state:-missing}, attempt $attempt/60)."
            fi

            sleep 10
          done

          echo "Exact-head Vercel Preview did not become ready within the bounded wait window." >&2
          exit 1

      - name: Start local ChromeDriver
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          command -v chromedriver >/dev/null
          chromedriver --port=9515 --verbose --log-path=/tmp/studihome-chromedriver.log &
          echo "CHROMEDRIVER_PID=$!" >> "$GITHUB_ENV"

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9515/status >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/studihome-chromedriver.log >&2 || true
            echo "ChromeDriver did not become ready." >&2
            exit 1
          fi

      - name: Public Preview browser acceptance
        run: |
          set -euo pipefail
          echo "Preview binding: ${PREVIEW_BINDING:-unknown}"
          python3 scripts/preview-browser-acceptance.py --preview-url "$PREVIEW_URL"

      - name: ChromeDriver diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/studihome-chromedriver.log >&2 || true
          if [ -f /tmp/studihome-preview-browser-failure.png ]; then
            echo "Failure screenshot captured at /tmp/studihome-preview-browser-failure.png"
          fi

      - name: Stop ChromeDriver
        if: always()
        shell: bash
        run: |
          if [ -n "${CHROMEDRIVER_PID:-}" ]; then
            kill "$CHROMEDRIVER_PID" >/dev/null 2>&1 || true
          fi
