name: One-time load Admin Dapur CRUD actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'studihome'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Inject actions loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-dapur.js')
          s=p.read_text(encoding='utf-8')
          marker="  function loadAdminDapurActions() {\n"
          fn='''  function loadAdminDapurActions() {\n    if (document.querySelector('script[data-studihome-admin-dapur-actions]')) return;\n    const s = document.createElement('script');\n    s.src = '/admin-dapur-actions.js?v=1';\n    s.dataset.studihomeAdminDapurActions = '1';\n    s.defer = true;\n    document.head.appendChild(s);\n  }\n\n'''
          if marker not in s:
            anchor="  async function loadManagedCreators() {\n"
            if anchor not in s: raise SystemExit('anchor not found')
            s=s.replace(anchor,fn+anchor,1)
          if 'loadAdminDapurActions();' not in s:
            s=s.replace("    const root = panel();\n", "    loadAdminDapurActions();\n    const root = panel();\n", 1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-time-load-admin-dapur-actions.yml').unlink()
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dapur.js .github/workflows/one-time-load-admin-dapur-actions.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: attach Admin Dapur Creator CRUD actions"
          git push origin HEAD:main
