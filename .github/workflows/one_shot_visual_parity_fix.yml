name: one-shot-visual-parity-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Tailwind with CDN-equivalent base layer
        run: |
          cat > tailwind.input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          cat > tailwind.config.cjs <<'EOF'
          module.exports = {
            content: ['./**/*.{html,js}'],
          };
          EOF
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind-compiled.css --minify
          test -s tailwind-compiled.css

      - name: Preserve exact existing UI while restoring Tailwind cascade parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css_link = '<link rel="stylesheet" href="/tailwind-compiled.css?v=20260817r2">'
          import re
          s = re.sub(r'\s*<!-- Tailwind CSS: compiled production utility layer -->\s*<link rel="stylesheet" href="/tailwind-compiled\.css\?v=20260817r1">', '', s, count=1)
          if 'https://cdn.tailwindcss.com' in s:
              raise SystemExit('Tailwind CDN reference still present')
          if 'id="login-email" autocomplete="username"' not in s:
              s = s.replace('id="login-email" required', 'id="login-email" autocomplete="username" required', 1)
          if 'id="login-password" autocomplete="current-password"' not in s:
              s = s.replace('id="login-password" required', 'id="login-password" autocomplete="current-password" required', 1)
          if 'id="reg-password" autocomplete="new-password"' not in s:
              s = s.replace('id="reg-password" required', 'id="reg-password" autocomplete="new-password" required', 1)
          if 'id="reg-email" autocomplete="email"' not in s:
              s = s.replace('id="reg-email" required', 'id="reg-email" autocomplete="email" required', 1)
          if 'id="reg-name" autocomplete="name"' not in s:
              s = s.replace('id="reg-name" required', 'id="reg-name" autocomplete="name" required', 1)
          if 'id="reg-phone" autocomplete="tel"' not in s:
              s = s.replace('id="reg-phone" required', 'id="reg-phone" autocomplete="tel" required', 1)
          if css_link not in s:
              s = s.replace('</head>', f'    <!-- Tailwind CSS: compiled production utility layer, CDN-equivalent cascade -->\n    {css_link}\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Make homepage HTML fresh during release verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vercel.json')
          s = p.read_text(encoding='utf-8')
          marker = '    {\n      "source": "/dapur.html",'
          if marker not in s:
              raise SystemExit('Expected vercel header structure not found')
          index_header = '    {\n      "source": "/index.html",\n      "headers": [\n        { "key": "Cache-Control", "value": "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" }\n      ]\n    },\n'
          if '"source": "/index.html"' not in s:
              s = s.replace('  "headers": [\n', '  "headers": [\n' + index_header, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify invariants
        run: |
          ! grep -q 'https://cdn.tailwindcss.com' index.html
          grep -q 'tailwind-compiled.css?v=20260817r2' index.html
          grep -q 'id="login-email" autocomplete="username"' index.html
          grep -q 'id="login-password" autocomplete="current-password"' index.html
          grep -q 'source": "/index.html"' vercel.json
          test -s tailwind-compiled.css
          grep -q -- '--tw-' tailwind-compiled.css

      - name: Remove one-shot workflow and commit
        run: |
          rm -f tailwind.input.css tailwind.config.cjs .github/workflows/one_shot_visual_parity_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tailwind-compiled.css vercel.json .github/workflows/one_shot_visual_parity_fix.yml
          git commit -m 'fix: restore homepage visual parity and complete auth autocomplete'
          git push origin main
