name: restore-locked-home-hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore locked hero guard and verify auth accessibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          guard = '''\n<style id="studihome-home-hero-lock-rc-final">\n/* FINAL HOMEPAGE HERO LOCK — restores the agreed hero presentation after compiled utility CSS. */\n.hero-stage {\n  background: linear-gradient(180deg, #151c75 0%, #1f2b99 44%, #3f48bf 100%) !important;\n  background-image: linear-gradient(180deg, #151c75 0%, #1f2b99 44%, #3f48bf 100%) !important;\n}\n.hero-stage .hero-visual { background: transparent !important; }\n.hero-stage .hero-visual::before {\n  background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(63,72,191,.18)) !important;\n}\n</style>\n'''
          if 'id="studihome-home-hero-lock-rc-final"' not in s:
              if '</head>' not in s:
                  raise SystemExit('Cannot locate </head> in index.html')
              s = s.replace('</head>', guard + '</head>', 1)
          checks = {
              'hero-lock': 'id="studihome-home-hero-lock-rc-final"' in s,
              'hero-stage': '.hero-stage {' in s,
              'login-username': 'id="login-email" autocomplete="username"' in s,
              'login-password': 'id="login-password" autocomplete="current-password"' in s,
              'register-password': 'id="reg-password" autocomplete="new-password"' in s,
              'tailwind-cdn-absent': 'https://cdn.tailwindcss.com' not in s,
          }
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant failure: ' + ', '.join(failed))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore_locked_home_hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore_locked_home_hero.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore locked homepage hero without changing design'
          git push origin main
