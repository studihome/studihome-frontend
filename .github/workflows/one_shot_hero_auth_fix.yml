name: one-shot-hero-auth-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage hero cascade and auth autocomplete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'id="login-email" required'
          new = 'id="login-email" autocomplete="username" required'
          if old not in s:
              if new not in s:
                  raise SystemExit('login-email marker not found')
          else:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          cat >> tailwind-compiled.css <<'EOF'
          .card-3d[class~="bg-gradient-to-br"][class~="from-[#151c75]"][class~="to-[#3f48bf"]]{background-image:linear-gradient(to bottom right,#151c75,#3f48bf)!important}
          EOF

      - name: Verify
        run: |
          grep -q 'id="login-email" autocomplete="username"' index.html
          ! grep -q 'cdn.tailwindcss.com' index.html
          grep -q 'class~="bg-gradient-to-br"' tailwind-compiled.css

      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/one_shot_hero_auth_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tailwind-compiled.css .github/workflows/one_shot_hero_auth_fix.yml
          git commit -m 'fix: restore locked homepage hero visual and auth autocomplete'
          git push origin main
