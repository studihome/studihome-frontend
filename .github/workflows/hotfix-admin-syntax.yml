name: Scoped Admin Syntax Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair verified JavaScript syntax regressions
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "freshBoost: App.studioAI.smartQualityEngine._freshCreatorBoost(creator)\n                        },\n                    },",
                  "freshBoost: App.studioAI.smartQualityEngine._freshCreatorBoost(creator)\n                        };\n                    },"
              ),
              (
                  "qualityReasons: qualityReason.slice(0, 2)\n                        },\n                    },",
                  "qualityReasons: qualityReason.slice(0, 2)\n                        };\n                    },"
              ),
              (
                  "contextCoverage\n                        },\n                    },",
                  "contextCoverage\n                        };\n                    },"
              )
          ]
          changed = 0
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
              changed += 1
          p.write_text(text, encoding='utf-8')
          print(f'Repaired {changed} verified syntax regressions.')

      - name: Validate inline JavaScript syntax
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.I | re.S)
          checked = 0
          for i, source in enumerate(scripts):
              if not source.strip() or 'application/ld+json' in html[:html.find(source)].split('<script')[-1]:
                  continue
              f = Path(tempfile.gettempdir()) / f'studihome-inline-{i}.js'
              f.write_text(source, encoding='utf-8')
              result = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(f'Inline script syntax validation failed at block {i}.')
              checked += 1
          print(f'Validated {checked} inline JavaScript blocks.')

      - name: Commit only verified hotfix and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/hotfix-admin-syntax.yml
          git add -- index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: repair admin JavaScript syntax regression"
          git push