name: one-shot-production-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Tailwind source
        run: |
          cat > tailwind.input.css <<'EOF'
          @tailwind utilities;
          EOF
          cat > tailwind.config.cjs <<'EOF'
          module.exports = {
            content: ['./**/*.{html,js}'],
            corePlugins: { preflight: false },
          };
          EOF

      - name: Compile production utility CSS
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind-compiled.css --minify
          test -s tailwind-compiled.css

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<!-- Tailwind CSS CDN -->\n    <script src="https://cdn.tailwindcss.com"></script>'
          new = '<!-- Tailwind CSS: compiled production utility layer -->\n    <link rel="stylesheet" href="/tailwind-compiled.css?v=20260817r1">'
          if old not in s:
              raise SystemExit('Tailwind CDN marker not found')
          s = s.replace(old, new, 1)
          replacements = {
              'id="login-password" required': 'id="login-password" autocomplete="current-password" required',
              'id="reg-password" required': 'id="reg-password" autocomplete="new-password" required',
              'id="reg-email" required': 'id="reg-email" autocomplete="email" required',
              'id="reg-name" required': 'id="reg-name" autocomplete="name" required',
              'id="reg-phone" required': 'id="reg-phone" autocomplete="tel" required',
          }
          for a, b in replacements.items():
              if a not in s:
                  raise SystemExit(f'Expected auth field marker not found: {a}')
              s = s.replace(a, b, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify source invariants
        run: |
          ! grep -q 'https://cdn.tailwindcss.com' index.html
          grep -q 'tailwind-compiled.css?v=20260817r1' index.html
          grep -q 'id="login-password" autocomplete="current-password"' index.html
          grep -q 'id="reg-password" autocomplete="new-password"' index.html
          grep -q 'id="reg-email" autocomplete="email"' index.html
          grep -q 'id="reg-name" autocomplete="name"' index.html
          grep -q 'id="reg-phone" autocomplete="tel"' index.html

      - name: Commit production changes and remove codemod
        run: |
          rm -f tailwind.input.css tailwind.config.cjs
          rm -f .github/workflows/one_shot_production_cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tailwind-compiled.css .github/workflows/one_shot_production_cleanup.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remove Tailwind CDN warning and harden auth autocomplete'
          git push origin main
