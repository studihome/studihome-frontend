name: Temporary UX validation
on:
  push:
    branches: [feat/studio-ai-dapur-ux-hardening-20260821]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check studio-ai-creator-card.js
          node --check dapur-editor-ux-v1.js
          node --check dapur-entry.js
          node --check dapur-editor.js
      - name: Diff hygiene
        run: git diff --check HEAD~1..HEAD || true
