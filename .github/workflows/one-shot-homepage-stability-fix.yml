name: one-shot-homepage-stability-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal production-safe fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = 'class="card-3d p-6 sm:p-10 md:p-12 rounded-3xl mb-8 sm:mb-10 relative overflow-hidden bg-gradient-to-br from-[#151c75] to-[#3f48bf] text-white border border-blue-900/30 shadow-2xl"'
          new_hero = 'class="hero-stage card-3d p-6 sm:p-10 md:p-12 rounded-3xl mb-8 sm:mb-10 relative overflow-hidden bg-gradient-to-br from-[#151c75] to-[#3f48bf] text-white border border-blue-900/30 shadow-2xl"'
          if old_hero not in s:
              raise SystemExit('Canonical homepage hero marker not found')
          s = s.replace(old_hero, new_hero, 1)

          old_login = 'id="login-email" required'
          new_login = 'id="login-email" autocomplete="username" required'
          if old_login not in s and new_login not in s:
              raise SystemExit('login-email marker not found')
          s = s.replace(old_login, new_login, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify invariants
        shell: bash
        run: |
          grep -q 'class="hero-stage card-3d p-6 sm:p-10 md:p-12 rounded-3xl' index.html
          grep -q 'id="login-email" autocomplete="username"' index.html
          grep -q 'hero-stage {' index.html
          ! grep -q 'https://cdn.tailwindcss.com' index.html

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-homepage-stability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-homepage-stability-fix.yml
          git commit -m 'fix(home): restore blue hero lock and auth autocomplete' || exit 0
          git push origin main
