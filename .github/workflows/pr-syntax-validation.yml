name: Studihome Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studihome-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in             static-search-actions.js             static-studio-brief-actions.js             static-auth-actions.js             static-shell-actions.js             studio-ai-creator-card.js             dapur-entry.js             dapur-editor.js             sw.js             supabase-sdk-loader-v1.js             supabase-config.js             api/agent-search.js             api/index-push.js             api/markdown.js             api/sitemap.js             api/version.js             portfolio-route.js
          do
            if [ -f "$file" ]; then
              echo "Checking $file"
              node --check "$file"
            fi
          done

      - name: Inline JavaScript syntax
        shell: python3 {0}
        run: |
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          for html_name in ('dapur.html', 'index.html'):
              html = Path(html_name).read_text(encoding='utf-8')
              blocks = re.findall(
                  r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',
                  html,
                  flags=re.I | re.S,
              )
              checked = 0
              for i, (attrs, body) in enumerate(blocks):
                  if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                      continue
                  if re.search(
                      r'type\s*=\s*["\']application/ld\+json["\']',
                      attrs,
                      flags=re.I,
                  ):
                      continue
                  if not body.strip():
                      continue

                  path = Path(tempfile.gettempdir()) / f'{html_name}-{i}.js'
                  path.write_text(body, encoding='utf-8')
                  result = subprocess.run(
                      ['node', '--check', str(path)],
                      text=True,
                      capture_output=True,
                  )
                  if result.returncode != 0:
                      print(result.stderr)
                      raise SystemExit(
                          f'Inline JavaScript syntax failure in '
                          f'{html_name} block {i}.'
                      )
                  checked += 1

              print(
                  f'{html_name}: validated {checked} inline '
                  'JavaScript blocks.'
              )

      - name: Structured configuration validation
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          candidates = [
              Path('vercel.json'),
              Path('manifest.webmanifest'),
              Path('openapi.json'),
          ]

          for path in candidates:
              if not path.exists():
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'{path}: valid JSON')

      - name: P0 push rollout guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          migration = Path(
              'DATABASE_MIGRATION_46_PUSH_SUBSCRIPTIONS.sql'
          ).read_text(encoding='utf-8')

          required_index = [
              'window.StudihomePWA.PUSH_ROLLOUT_ENABLED = false;',
              "if (!window.StudihomePWA.PUSH_ROLLOUT_ENABLED) return null;",
              "if (!window.StudihomePWA.PUSH_ROLLOUT_ENABLED) return;",
          ]
          for marker in required_index:
              if marker not in index:
                  raise SystemExit(
                      f'P0 push gate missing from index.html: {marker}'
                  )

          forbidden_auto_sync = (
              'if (window.StudihomePWA?.syncSubscription) '
              'window.StudihomePWA.syncSubscription();'
          )
          if forbidden_auto_sync in index:
              raise SystemExit(
                  'Automatic push subscription must not run during '
                  'login/registration.'
              )

          forbidden_m46 = [
              'CREATE POLICY push_subscriptions_service_read',
              'SECURITY DEFINER\nSET search_path',
              'SELECT id FROM push_notification_log ORDER BY id DESC',
          ]
          for marker in forbidden_m46:
              if marker in migration:
                  raise SystemExit(
                      f'Unsafe M46 pattern reintroduced: {marker}'
                  )

          required_m46 = [
              'REVOKE ALL ON TABLE public.push_subscriptions '
              'FROM PUBLIC, anon, authenticated;',
              'TO authenticated\nUSING ((SELECT auth.uid()) = user_id);',
              'DROP FUNCTION IF EXISTS '
              'public.trigger_push_notification(text, text, text, uuid[]);',
          ]
          for marker in required_m46:
              if marker not in migration:
                  raise SystemExit(
                      f'Required M46 hardening missing: {marker}'
                  )

          print('P0 push rollout and M46 guardrails: PASS')

      - name: Public runtime secret-pattern scan
        shell: python3 {0}
        run: |
          import re
          from pathlib import Path

          roots = [
              Path('index.html'),
              Path('dapur.html'),
              Path('supabase-config.js'),
              Path('dapur-entry.js'),
              Path('dapur-editor.js'),
              Path('studio-ai-creator-card.js'),
          ]

          patterns = {
              'Supabase secret key': re.compile(r'sb_secret_[A-Za-z0-9_-]+'),
              'service_role JWT claim': re.compile(
                  r'["\']role["\']\s*:\s*["\']service_role["\']'
              ),
          }

          for path in roots:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      raise SystemExit(
                          f'{label} pattern found in public runtime: {path}'
                      )

          print('Public runtime secret-pattern scan: PASS')

      - name: Security, dependency, and PWA guardrails
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          vercel = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          rules = {
              item['source']: {
                  h['key']: h['value']
                  for h in item.get('headers', [])
              }
              for item in vercel.get('headers', [])
          }
          global_headers = rules.get('/(.*)', {})
          expected_headers = {
              'Strict-Transport-Security': 'max-age=31536000',
              'X-Content-Type-Options': 'nosniff',
              'Referrer-Policy': 'strict-origin-when-cross-origin',
              'X-Frame-Options': 'DENY',
              'Content-Security-Policy': "frame-ancestors 'none';",
          }
          for key, value in expected_headers.items():
              if global_headers.get(key) != value:
                  raise SystemExit(
                      f'Missing/incorrect global security header: {key}'
                  )

          exact_sdk = (
              'https://cdn.jsdelivr.net/npm/'
              '@supabase/supabase-js@2.115.0'
          )
          browser_files = [
              Path('index.html'),
              Path('supabase-sdk-loader-v1.js'),
              Path('admin-dapur-creator-v5.js'),
          ]
          for path in browser_files:
              body = path.read_text(encoding='utf-8')
              if '@supabase/supabase-js@2' in body and exact_sdk not in body:
                  raise SystemExit(
                      f'Unpinned Supabase browser SDK in {path}'
                  )
              if 'unpkg.com/@supabase/supabase-js' in body:
                  raise SystemExit(
                      f'CSP-incompatible Supabase fallback in {path}'
                  )

          sw = Path('sw.js').read_text(encoding='utf-8')
          required_sw = [
              "studihome-shell-v5",
              "studihome-runtime-v2",
              "cache.put(req, copy)",
              "if (!url.search)",
          ]
          for item in required_sw:
              if item not in sw:
                  raise SystemExit(
                      f'Release-aware PWA cache guard missing: {item}'
                  )
          if 'cleanKey(url)' in sw:
              raise SystemExit(
                  'Service worker must not strip cache-buster queries '
                  'from static assets.'
              )

          print('Security/dependency/PWA guardrails: PASS')

      - name: First-party browser messaging and PWA prompt guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          browser_runtime_files = [
              Path('index.html'),
              Path('dapur.html'),
              Path('sw.js'),
              Path('creator-public.js'),
              Path('studio-ai-creator-card.js'),
              Path('social-proof-widget.js'),
              Path('dapur-entry.js'),
              Path('dapur-editor.js'),
          ]

          forbidden_extension_messaging = [
              'chrome.runtime',
              'browser.runtime',
              '.runtime.sendMessage(',
              '.runtime.onMessage',
          ]

          for path in browser_runtime_files:
              if not path.exists():
                  continue
              body = path.read_text(encoding='utf-8', errors='replace')
              for marker in forbidden_extension_messaging:
                  if marker in body:
                      raise SystemExit(
                          f'Unexpected browser-extension messaging API in '
                          f'first-party runtime {path}: {marker}'
                      )

          index = Path('index.html').read_text(encoding='utf-8')
          pwa_markers = [
              "window.addEventListener('beforeinstallprompt'",
              'e.preventDefault();',
              'deferred = e;',
              'deferred.prompt();',
              'deferred.userChoice.then',
              "window.addEventListener('appinstalled'",
          ]
          for marker in pwa_markers:
              if marker not in index:
                  raise SystemExit(
                      f'Custom PWA install flow guard missing: {marker}'
                  )

          sw = Path('sw.js').read_text(encoding='utf-8')
          if "addEventListener('message'" in sw or 'addEventListener("message"' in sw:
              raise SystemExit(
                  'Service worker message channel added without an explicit '
                  'audited contract.'
              )

          print('First-party messaging/PWA prompt guardrails: PASS')

      - name: SEO, trust, and crawl guardrails
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          robots = Path('robots.txt').read_text(encoding='utf-8')
          sitemap = Path('api/sitemap.js').read_text(encoding='utf-8')
          vercel = json.loads(Path('vercel.json').read_text(encoding='utf-8'))

          for required in ['/privasi', '/ketentuan']:
              if f'href="{required}"' not in index:
                  raise SystemExit(f'Missing footer trust link: {required}')
              if required not in sitemap:
                  raise SystemExit(f'Missing sitemap trust route: {required}')

          rewrite_map = {
              item.get('source'): item.get('destination')
              for item in vercel.get('rewrites', [])
          }
          expected = {
              '/privasi': '/privacy.html',
              '/ketentuan': '/terms.html',
          }
          for source, destination in expected.items():
              if rewrite_map.get(source) != destination:
                  raise SystemExit(
                      f'Missing trust-page rewrite: {source}'
                  )

          private_routes = [
              '/admin', '/kamar', '/dapur',
              '/dashboard', '/creator-studio', '/ruang-kerja'
          ]
          for route in private_routes:
              if robots.count(f'Disallow: {route}') < 2:
                  raise SystemExit(
                      f'Private crawl boundary not repeated: {route}'
                  )

          if 'new Date().toISOString().slice(0, 10)' in sitemap:
              raise SystemExit(
                  'Sitemap must not invent lastmod using request date.'
              )

          if 'Tingkatkan efisiensi kerja hingga 10x lipat' in index:
              raise SystemExit('Unsupported homepage numeric claim restored.')

          print('SEO/trust/crawl guardrails: PASS')

      - name: Private crawl and admin snippet guardrails
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          vercel = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          header_map = {
              item.get('source'): {
                  h.get('key'): h.get('value')
                  for h in item.get('headers', [])
              }
              for item in vercel.get('headers', [])
          }

          private_paths = [
              '/admin', '/kamar', '/dapur', '/dapur.html',
              '/dashboard', '/creator-studio', '/ruang-kerja'
          ]
          expected = 'noindex, nofollow, noarchive'
          for path in private_paths:
              if header_map.get(path, {}).get('X-Robots-Tag') != expected:
                  raise SystemExit(
                      f'Missing private X-Robots-Tag header: {path}'
                  )
              if not path.endswith('.html'):
                  nested = f'{path}/:path*'
                  if header_map.get(nested, {}).get('X-Robots-Tag') != expected:
                      raise SystemExit(
                          f'Missing nested private X-Robots-Tag header: {nested}'
                      )

          dapur = Path('dapur.html').read_text(encoding='utf-8').lower()
          if 'name="robots" content="noindex, nofollow, noarchive"' not in dapur:
              raise SystemExit('Dapur meta robots noindex guard missing.')

          admin_gudang = Path('admin-gudang-v2.js').read_text(encoding='utf-8')
          admin_dapur = Path('admin-dapur-creator-v5.js').read_text(encoding='utf-8')
          if '<section id="admin-gudang-v2" data-nosnippet' not in admin_gudang:
              raise SystemExit('Admin Gudang data-nosnippet guard missing.')
          if '<div id="admin-dapur-creator-v5" data-nosnippet' not in admin_dapur:
              raise SystemExit('Admin Dapur data-nosnippet guard missing.')

          print('Private crawl/admin snippet guardrails: PASS')

      - name: Public route namespace guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          sitemap = Path('api/sitemap.js').read_text(encoding='utf-8')
          migration = Path(
              'supabase/migrations/'
              '20260906150336_guard_public_route_namespace.sql'
          ).read_text(encoding='utf-8')

          required_sitemap = [
              'const staticRootPaths = new Set(',
              'if (staticRootPaths.has(categoryPath))',
              "category route shadowed by static route; skipped",
          ]
          for marker in required_sitemap:
              if marker not in sitemap:
                  raise SystemExit(
                      f'Sitemap namespace dedupe guard missing: {marker}'
                  )

          required_db = [
              'studihome-public-route:',
              'trg_creator_public_route_namespace',
              'trg_category_public_route_namespace',
              'is_reserved_public_route_slug',
              'pg_advisory_xact_lock',
          ]
          for marker in required_db:
              if marker not in migration:
                  raise SystemExit(
                      f'Database namespace guard missing: {marker}'
                  )

          print('Public route namespace guardrails: PASS')

      - name: Supabase least-privilege migration guardrails
        shell: python3 {0}
        run: |
          import re
          from pathlib import Path

          migration_dir = Path('supabase/migrations')
          if not migration_dir.exists():
              raise SystemExit('supabase/migrations directory missing')

          dangerous = re.compile(
              r'grant\s+[^;]*(?:truncate|trigger|references)[^;]*'
              r'\bto\s+(?:anon|authenticated)\b',
              flags=re.I | re.S,
          )

          anon_write = re.compile(
              r'grant\s+[^;]*(?:insert|update|delete)[^;]*'
              r'on\s+(?:table\s+)?public\.'
              r'(?:modules|site_settings|testimonials)\b'
              r'[^;]*\bto\s+anon\b',
              flags=re.I | re.S,
          )

          for path in sorted(migration_dir.glob('*.sql')):
              body = path.read_text(encoding='utf-8', errors='replace')
              sql = re.sub(r'--[^\n]*', '', body)
              if dangerous.search(sql):
                  raise SystemExit(
                      f'Dangerous browser-role table privilege in {path}'
                  )
              if anon_write.search(sql):
                  raise SystemExit(
                      f'Anon write grant on public-read table in {path}'
                  )

          required = migration_dir / (
              '20260906150757_harden_browser_table_privileges.sql'
          )
          if not required.exists():
              raise SystemExit('Browser ACL hardening migration missing')

          print('Supabase least-privilege migration guardrails: PASS')

      - name: Public API upstream timeout guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          agent = Path('api/agent-search.js').read_text(encoding='utf-8')
          markdown = Path('api/markdown.js').read_text(encoding='utf-8')
          sitemap = Path('api/sitemap.js').read_text(encoding='utf-8')
          index_push = Path('api/index-push.js').read_text(encoding='utf-8')

          required_agent = [
              'SUPABASE_READ_TIMEOUT_MS = 3500',
              'INTENT_LOG_TIMEOUT_MS = 1200',
              'withAbortTimeout',
              '{ headers, signal }',
              "error?.name === 'AbortError'",
          ]
          for marker in required_agent:
              if marker not in agent:
                  raise SystemExit(
                      f'agent-search timeout guard missing: {marker}'
                  )

          required_markdown = [
              'SUPABASE_READ_TIMEOUT_MS = 3500',
              'withAbortTimeout',
              'fetch(url, { headers, signal })',
              "error?.name === 'AbortError'",
          ]
          for marker in required_markdown:
              if marker not in markdown:
                  raise SystemExit(
                      f'markdown timeout guard missing: {marker}'
                  )

          if 'SUPABASE_READ_TIMEOUT_MS = 3500' not in sitemap:
              raise SystemExit('sitemap upstream timeout guard missing')
          if 'REQUEST_TIMEOUT_MS = 10000' not in index_push:
              raise SystemExit('index-push request timeout guard missing')

          print('Public API upstream timeout guardrails: PASS')

      - name: Admin Dapur Supabase singleton regression
        run: node tests/admin-dapur-supabase-singleton-regression.js

      - name: Dapur auth modal accessibility regression
        run: node tests/dapur-auth-modal-accessibility-regression.js

      - name: CSP static Search actions regression
        run: node tests/csp-static-search-actions-regression.js

      - name: CSP static Studio Brief actions regression
        run: node tests/csp-static-studio-brief-actions-regression.js

      - name: CSP static Auth actions regression
        run: node tests/csp-static-auth-actions-regression.js

      - name: CSP zero static inline handlers regression
        run: node tests/csp-static-shell-actions-regression.js

      - name: CSP SMART generated action regression
        run: node tests/csp-smart-generated-action-regression.js

      - name: Admin bulk portfolio intake regression
        run: node tests/admin-bulk-portfolio-intake-regression.js

      - name: Entitlements redundant index regression
        run: node tests/entitlements-redundant-index-regression.js

      - name: Creator trust metrics visibility regression
        run: node tests/creator-trust-metrics-visibility-regression.js

      - name: Console hygiene and avatar resilience regression
        run: node tests/console-hygiene-avatar-resilience-regression.js

      - name: Public API resilience regression
        run: node tests/api-resilience-regression.js

      - name: Portfolio route collision regression
        run: node tests/portfolio-route-regression.js

      - name: Sitemap collision regression
        run: node tests/sitemap-collision-regression.js

      - name: IndexNow portfolio canonical regression
        run: node tests/index-push-canonical-regression.js

      - name: Portfolio canonical route guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          route = Path('portfolio-route.js').read_text(encoding='utf-8')
          sitemap = Path('api/sitemap.js').read_text(encoding='utf-8')
          markdown = Path('api/markdown.js').read_text(encoding='utf-8')
          index_push = Path('api/index-push.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          required_route = [
              "COLLISION_SEPARATOR = '--'",
              'COLLISION_SUFFIX_STEPS',
              'routeSlug',
              'findByRouteSlug',
              'Backward compatibility for historical title-only deep links',
          ]
          for value in required_route:
              if value not in route:
                  raise SystemExit(
                      f'Portfolio route helper guard missing: {value}'
                  )

          required_server = {
              'api/sitemap.js': (
                  sitemap,
                  [
                      'portfolioRouteSlug',
                      'portfoliosByCreatorId',
                      'select=id,creator_id,title',
                  ],
              ),
              'api/markdown.js': (
                  markdown,
                  [
                      'portfolioRouteSlug',
                      'findPortfolioByRouteSlug',
                      'canonicalPortfolioSlug',
                  ],
              ),
              'api/index-push.js': (
                  index_push,
                  [
                      'portfolioRouteSlug',
                      'findPortfolioByRouteSlug',
                      'Use the canonical portfolio URL.',
                      'canonicalUrl',
                  ],
              ),
          }
          for path, (body, markers) in required_server.items():
              for value in markers:
                  if value not in body:
                      raise SystemExit(
                          f'Portfolio canonical guard missing in {path}: {value}'
                      )

          required_browser = [
              '_routeSlug:',
              "const collisionSeparator = '--';",
              '_findPortfolioByRoute:',
              'targetPortfolioSlug',
              'window.history.replaceState',
              'App.creator._routeSlug(savedPortfolio,siblings)',
          ]
          for value in required_browser:
              if value not in index:
                  raise SystemExit(
                      f'Browser portfolio canonical guard missing: {value}'
                  )

          forbidden = [
              'find(p => App.creator._slugify(p.title) === String(portfolioSlug).toLowerCase())',
              'triggerIndexNow(this.data.profile.username,App.creator._slugify(title))',
              'const slug = slugify(portfolio.title);',
          ]
          forbidden_separator_patterns = [
              "return \`${base.slice(0, baseLimit)}-${suffix}\`;",
              "return base.slice(0, baseLimit) + '-' + suffix;",
          ]
          for value in forbidden_separator_patterns:
              if value in route or value in index:
                  raise SystemExit(
                      f'Unsafe single-hyphen collision namespace restored: {value}'
                  )

          combined = '\n'.join((index, sitemap, markdown, index_push))
          for value in forbidden:
              if value in combined:
                  raise SystemExit(
                      f'Legacy title-only portfolio route restored: {value}'
                  )

          print('Portfolio canonical route guardrails: PASS')

      - name: Edge Function dependency pin guardrails
        shell: python3 {0}
        run: |
          import re
          from pathlib import Path

          expected = 'npm:@supabase/supabase-js@2.115.0'
          function_root = Path('supabase/functions')
          if not function_root.exists():
              raise SystemExit('Supabase function source directory missing')

          candidates = [
              *function_root.rglob('*.ts'),
              *function_root.rglob('deno.json'),
              *function_root.rglob('deno.jsonc'),
          ]

          ranged = re.compile(
              r'npm:@supabase/supabase-js@2(?=[\"\'\s,}])'
          )
          seen = 0
          for path in candidates:
              body = path.read_text(encoding='utf-8', errors='replace')
              if 'supabase-js' not in body:
                  continue
              seen += 1
              if ranged.search(body):
                  raise SystemExit(
                      f'Unpinned Supabase Edge dependency in {path}'
                  )
              if (
                  'npm:@supabase/supabase-js@' in body
                  and expected not in body
              ):
                  raise SystemExit(
                      f'Unexpected Supabase Edge version in {path}'
                  )

          if seen < 3:
              raise SystemExit(
                  f'Expected at least 3 Supabase Edge dependency references, got {seen}'
              )

          print('Edge Function dependency pin guardrails: PASS')

      - name: Legacy Edge Function quarantine guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          forbidden = ('smooth-action', 'swift-endpoint')
          runtime_suffixes = ('.html', '.js', '.mjs', '.ts')
          ignored_roots = {
              '.git', '.github', 'supabase/functions', 'tests'
          }

          violations = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in runtime_suffixes:
                  continue

              normalized = path.as_posix()
              if any(
                  normalized == root or normalized.startswith(root + '/')
                  for root in ignored_roots
              ):
                  continue

              body = path.read_text(encoding='utf-8', errors='replace')
              for slug in forbidden:
                  if slug in body:
                      violations.append(f'{normalized}: {slug}')

          if violations:
              raise SystemExit(
                  'Legacy Edge Function runtime reference detected:\n'
                  + '\n'.join(violations)
              )

          print('Legacy Edge Function quarantine guardrails: PASS')

      - name: Runtime version endpoint regression
        run: node tests/version-endpoint-regression.js

      - name: Production smoke script self-test
        run: |
          python3 -m py_compile scripts/production-smoke.py
          python3 scripts/production-smoke.py --self-test

      - name: Production smoke workflow guardrails
        shell: python3 {0}
        run: |
          from pathlib import Path

          version_api = Path('api/version.js').read_text(encoding='utf-8')
          workflow = Path(
              '.github/workflows/production-smoke.yml'
          ).read_text(encoding='utf-8')
          smoke = Path(
              'scripts/production-smoke.py'
          ).read_text(encoding='utf-8')

          required_api = [
              'VERCEL_GIT_COMMIT_SHA',
              'VERCEL_ENV',
              "Cache-Control', 'no-store, max-age=0",
              'SHA_PATTERN',
          ]
          for marker in required_api:
              if marker not in version_api:
                  raise SystemExit(
                      f'Production version endpoint guard missing: {marker}'
                  )

          required_workflow = [
              'name: Studihome Production Smoke',
              'uses: actions/checkout@v4',
              'EXPECTED_SHA: $' + '{{ github.sha }}',
              'run: python3 scripts/production-smoke.py',
          ]
          for marker in required_workflow:
              if marker not in workflow:
                  raise SystemExit(
                      f'Production smoke workflow guard missing: {marker}'
                  )

          required_smoke = [
              'Wait for production alias SHA',
              '/api/version',
              '/sitemap.xml',
              'x-robots-tag',
              'content-security-policy',
              'send-email-verification',
              'provision_managed_creators',
              'expected 401',
              'Studihome production smoke: PASS',
          ]
          for marker in required_smoke:
              if marker not in smoke:
                  raise SystemExit(
                      f'Production smoke script guard missing: {marker}'
                  )

          print('Production smoke workflow guardrails: PASS')
      - name: Diff hygiene
        run: git diff --check
