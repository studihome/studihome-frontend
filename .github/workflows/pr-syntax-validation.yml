name: Frontend PR Syntax Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript modules
        run: |
          node --check studio-ai-creator-card.js
          node --check dapur-entry.js
          node --check dapur-editor.js

      - name: Check inline JavaScript in route shells
        shell: python3 {0}
        run: |
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          for html_name in ('dapur.html', 'index.html'):
              html = Path(html_name).read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', html, flags=re.I | re.S)
              checked = 0
              for i, (attrs, body) in enumerate(blocks):
                  if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                      continue
                  if re.search(r'type\s*=\s*["\']application/ld\+json["\']', attrs, flags=re.I):
                      continue
                  if not body.strip():
                      continue
                  path = Path(tempfile.gettempdir()) / f'{html_name}-{i}.js'
                  path.write_text(body, encoding='utf-8')
                  result = subprocess.run(['node', '--check', str(path)], text=True, capture_output=True)
                  if result.returncode != 0:
                      print(result.stderr)
                      raise SystemExit(f'Inline JavaScript syntax failure in {html_name} block {i}.')
                  checked += 1
              print(f'{html_name}: validated {checked} inline JavaScript blocks.')

      - name: Diff hygiene
        run: git diff --check
