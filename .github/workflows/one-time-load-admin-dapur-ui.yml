name: One-time load Admin Dapur UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'studihome' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Attach bridge and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin-dapur-actions.js')
          text = p.read_text(encoding='utf-8')
          marker = "<script data-studihome-admin-dapur-ui-bridge>"
          if marker not in text:
              text += "\n;(()=>{if(document.querySelector('script[data-studihome-admin-dapur-ui-bridge]'))return;const s=document.createElement('script');s.src='/admin-dapur-ui-bridge.js?v=1';s.dataset.studihomeAdminDapurUiBridge='1';s.defer=true;document.head.appendChild(s)})();\n"
              p.write_text(text, encoding='utf-8')
          wf = Path('.github/workflows/one-time-load-admin-dapur-ui.yml')
          if wf.exists(): wf.unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dapur-actions.js .github/workflows/one-time-load-admin-dapur-ui.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: activate easy Admin Dapur editor"
          git push origin HEAD:main
