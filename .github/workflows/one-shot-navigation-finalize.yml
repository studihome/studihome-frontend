name: Finalize Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          s = s.replace('    <script src="/dapur-creator-final-contract.js?v=1"></script>\n', '')

          runtime_tags = (
              '    <script src="/admin-dapur-creator-v5.js?v=5"></script>\n'
              '    <script src="/admin-gudang-v2.js?v=2"></script>\n'
          )
          if '/admin-dapur-creator-v5.js?v=5' not in s:
              s = s.replace('</head>', runtime_tags + '</head>', 1)

          old = '''                        <div class="flex flex-wrap items-center gap-1.5 mb-6 card-3d-inset p-1.5 rounded-2xl text-xs font-bold">\n                            <button onclick="App.admin.switchTab('orders')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'orders' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-receipt mr-1"></i> Transaksi\n                            </button>\n                            <button onclick="App.admin.switchTab('products')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'products' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-boxes-stacked mr-1"></i> Produk\n                            </button>\n                            <button onclick="App.admin.switchTab('modules')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'modules' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-book-open mr-1"></i> Modul\n                            </button>\n                            <button onclick="App.admin.switchTab('master')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'master' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-sliders mr-1"></i> Master Data\n                            </button>\n                            <button onclick="App.admin.switchTab('users')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'users' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-users mr-1"></i> Pengguna\n                            </button>\n                            <button onclick="App.admin.switchTab('creators')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'creators' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Creator\n                            </button>\n                            <button onclick="App.admin.switchTab('studio-ai')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'studio-ai' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-brain mr-1"></i> Studio AI\n                            </button>\n                            <button onclick="App.admin.switchTab('governance')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'governance' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-shield-halved mr-1"></i> Governance\n                            </button>\n\n                        </div>'''
          new = '''                        <div class="flex flex-wrap items-center gap-1.5 mb-6 card-3d-inset p-1.5 rounded-2xl text-xs font-bold">\n                            <button onclick="App.admin.switchTab('orders')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'orders' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-receipt mr-1"></i> Transaksi\n                            </button>\n                            <button onclick="App.admin.switchTab('products')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'products' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-boxes-stacked mr-1"></i> Produk\n                            </button>\n                            <button onclick="App.admin.switchTab('modules')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'modules' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-book-open mr-1"></i> Modul\n                            </button>\n                            <button onclick="App.admin.switchTab('master')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'master' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-sliders mr-1"></i> Master Data\n                            </button>\n                            <button onclick="App.admin.switchTab('users')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'users' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-users mr-1"></i> Pengguna\n                            </button>\n                            <button onclick="App.admin.switchTab('dapur-creator')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'dapur-creator' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-kitchen-set mr-1"></i> Dapur Creator\n                            </button>\n                            <button onclick="App.admin.switchTab('gudang')" class="px-3.5 py-2 rounded-xl transition-all ${activeTab === 'gudang' ? 'btn-brand-gradient shadow-xs' : 'text-slate-700 hover:text-[#151c75]'}">\n                                <i class="fa-solid fa-warehouse mr-1"></i> Gudang\n                            </button>\n                        </div>'''
          if old not in s:
              raise SystemExit('Admin tab contract not found; aborting to avoid unsafe mutation.')
          s = s.replace(old, new, 1)

          needle = '''                renderSubTab: async () => {\n                    const area = document.getElementById('admin-content-area');\n                    if (!area) return;\n\n                    try {\n                        const adminData = await App.api.post('GET_ADMIN_DATA');\n                        const tab = App.state.adminTab || 'orders';\n\n                        if (tab === 'studio-ai') {'''
          replacement = '''                renderSubTab: async () => {\n                    const area = document.getElementById('admin-content-area');\n                    if (!area) return;\n\n                    const tab = App.state.adminTab || 'orders';\n                    if (tab === 'dapur-creator') {\n                        window.StudihomeAdminDapurCreatorV5?.open?.();\n                        return;\n                    }\n                    if (tab === 'gudang') {\n                        window.StudihomeGudangV2?.open?.();\n                        return;\n                    }\n\n                    try {\n                        const adminData = await App.api.post('GET_ADMIN_DATA');\n\n                        if (tab === 'studio-ai') {'''
          if needle not in s:
              raise SystemExit('Admin renderSubTab contract not found; aborting to avoid unsafe mutation.')
          s = s.replace(needle, replacement, 1)

          if s == original:
              raise SystemExit('No changes made; aborting.')

          path.write_text(s, encoding='utf-8')
          legacy = Path('dapur-creator-final-contract.js')
          if legacy.exists():
              legacy.unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '/dapur-creator-final-contract.js' not in s
          assert 'App.admin.switchTab(\'dapur-creator\')' in s
          assert '> Dapur</' not in s
          assert 'Dapur Creator' in s
          assert 'Gudang' in s
          print('Canonical navigation validation passed.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dapur-creator-final-contract.js .github/workflows/one-shot-navigation-finalize.yml
          git commit -m "fix: make navigation native and remove global Dapur"
          git rm .github/workflows/one-shot-navigation-finalize.yml
          git commit -m "chore: remove one-shot navigation finalizer"
          git push origin main
