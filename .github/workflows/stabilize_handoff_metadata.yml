name: stabilize-handoff-metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove documentation-only deployment churn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MASTER_HANDOFF_PROMPT_STUDIHOME.md')
          s = p.read_text()
          s = s.replace('Latest Production deployment (documentation-lineage commit):\n`dpl_5goqrmzUamPSjEnHHRXTpsXqSzBd`\n\n', '')
          s = s.replace('latest Production deployment is `READY` and matches the current commit SHA;', 'functional application deployment is `READY` and matches the functional application SHA; documentation-only commits may create additional READY deployments without changing runtime application code;')
          p.write_text(s)
          p = Path('PROJECT_CONSTITUTION.md')
          s = p.read_text()
          s = s.replace('\n\nLatest Production deployment, including documentation-only lineage updates:\n`dpl_5goqrmzUamPSjEnHHRXTpsXqSzBd`', '')
          p.write_text(s)
          PY
          rm -f .github/workflows/stabilize_handoff_metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_HANDOFF_PROMPT_STUDIHOME.md PROJECT_CONSTITUTION.md .github/workflows/stabilize_handoff_metadata.yml
          git commit -m 'docs: stabilize release handoff metadata'
          git push origin main
