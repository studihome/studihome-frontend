name: One-shot canonical boot contract

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supabase-config.js'
      - '.github/workflows/_one-shot-boot-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical boot ordering and singleton
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any existing SDK/config tags first, wherever they are.
          s = re.sub(r'\s*<script src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>', '', s)
          s = re.sub(r'\s*<script src="\./supabase-config\.js(?:\?[^\"]*)?"\s*></script>', '', s)
          s = re.sub(r'\s*<script src="/supabase-config\.js(?:\?[^\"]*)?"\s*></script>', '', s)

          # Insert exactly one canonical boot block before feature runtimes/Tailwind.
          head_marker = '    <!-- Tailwind CSS CDN -->'
          boot_block = '''    <!-- CANONICAL SUPABASE BOOT: SDK + config before all feature runtimes -->\n    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>\n    <script src="/supabase-config.js?v=boot3"></script>\n\n'''
          if head_marker not in s:
              raise SystemExit('Head insertion marker not found.')
          s = s.replace(head_marker, boot_block + head_marker, 1)

          # Reuse the singleton and publish the exact same client to window.
          old = 'supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {'
          new = 'supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {'
          if old in s:
              s = s.replace(old, new, 1)

          if 'window.supabaseClient = supabaseClient;' not in s:
              marker = '        supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {'
              start = s.find(marker)
              if start == -1:
                  raise SystemExit('Canonical main createClient assignment not found.')
              end = s.find('            });', start)
              if end == -1:
                  raise SystemExit('Canonical main createClient closing not found.')
              end += len('            });')
              s = s[:end] + '\n            window.supabaseClient = supabaseClient;' + s[end:]

          if "label: 'Dapur'" in s or "label: 'Dapur Creator'" in s:
              raise SystemExit('Global header still declares Dapur; aborting.')
          if 'admin-dapur.js' in s:
              raise SystemExit('index.html still references legacy admin-dapur.js; aborting.')

          p.write_text(s, encoding='utf-8')

      - name: Validate canonical boot contract
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('cdn.jsdelivr.net/npm/@supabase/supabase-js@2') == 1
          assert s.count('/supabase-config.js?v=boot3') == 1
          assert 'window.supabaseClient = supabaseClient;' in s
          assert 'supabaseClient = window.supabaseClient || window.supabase.createClient' in s
          assert "label: 'Dapur'" not in s
          assert "label: 'Dapur Creator'" not in s
          assert 'admin-dapur.js' not in s
          print('Canonical boot/navigation contract OK')

      - name: Self remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/_one-shot-boot-contract.yml

      - name: Commit final boot contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_one-shot-boot-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: canonicalize Supabase boot and remove global Dapur contract'
          git push
