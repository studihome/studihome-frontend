name: One-shot canonical boot contract

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supabase-config.js'
      - '.github/workflows/_one-shot-boot-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical boot ordering and singleton
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Load the SDK + Supabase config before any Admin runtime scripts.
          head_marker = '    <!-- Tailwind CSS CDN -->'
          boot_block = '''    <!-- CANONICAL SUPABASE BOOT: SDK + config must load before feature runtimes -->\n    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>\n    <script src="/supabase-config.js?v=boot2"></script>\n\n'''
          if boot_block not in s:
              s = s.replace(head_marker, boot_block + head_marker, 1)

          # 2) Remove duplicate late SDK/config tags from the legacy bottom bootstrap.
          s = re.sub(r'\s*<script src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>', '', s)
          s = re.sub(r'\s*<script src="\./supabase-config\.js"></script>', '', s)

          # 3) Main bootstrap reuses the canonical singleton; never creates a second GoTrue client.
          old = 'supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {'
          new = 'supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {'
          if old in s:
              s = s.replace(old, new, 1)

          if 'window.supabaseClient = supabaseClient;' not in s:
              target = re.search(r'(supabaseClient\s*=\s*window\.supabaseClient\s*\|\|\s*window\.supabase\.createClient\(SUPABASE_URL, SUPABASE_ANON_KEY, \{.*?\n\s*\}\);)', s, re.S)
              if not target:
                  raise SystemExit('Canonical Supabase createClient block not found after patch.')
              end = target.end(1)
              s = s[:end] + '\n            window.supabaseClient = supabaseClient;' + s[end:]

          # 4) Ensure the canonical global navigation cannot declare Dapur.
          if "label: 'Dapur'" in s or "label: 'Dapur Creator'" in s:
              raise SystemExit('Global header navigation still declares Dapur; aborting.')
          if 'admin-dapur.js' in s:
              raise SystemExit('index.html still references legacy admin-dapur.js; aborting.')

          p.write_text(s, encoding='utf-8')

      - name: Validate canonical boot contract
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('/supabase-config.js?v=boot2') == 1
          assert s.count('cdn.jsdelivr.net/npm/@supabase/supabase-js@2') == 1
          assert 'window.supabaseClient = supabaseClient;' in s
          assert 'supabaseClient = window.supabaseClient || window.supabase.createClient' in s
          assert "label: 'Dapur'" not in s
          assert "label: 'Dapur Creator'" not in s
          assert 'admin-dapur.js' not in s
          print('Canonical boot and navigation contract OK')

      - name: Self remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/_one-shot-boot-contract.yml

      - name: Commit final boot contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_one-shot-boot-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: canonicalize Supabase boot and remove global Dapur contract'
          git push
