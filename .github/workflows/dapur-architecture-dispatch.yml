name: Trigger Dapur Architecture Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute canonical migration blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          wf = Path('.github/workflows/dapur-architecture-finalize.yml').read_text(encoding='utf-8')

          def extract_after(marker, next_marker):
              start = wf.index(marker)
              segment = wf[start:]
              start_py = segment.index('          from pathlib import Path')
              segment = segment[start_py:]
              end = segment.index(next_marker)
              code = segment[:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())

          apply_code = extract_after('      - name: Apply canonical Dapur architecture', '      - name: Remove obsolete Dapur header injectors')
          cleanup_code = extract_after('      - name: Remove obsolete Dapur header injectors', '      - name: Validate architecture')

          compile(apply_code, '<dapur-apply>', 'exec')
          exec(apply_code, {'__name__': '__main__'})
          compile(cleanup_code, '<dapur-cleanup>', 'exec')
          exec(cleanup_code, {'__name__': '__main__'})

          root = Path('.')
          s = Path('index.html').read_text(encoding='utf-8')
          nav = re.search(r'(?s)renderNavigation:\s*\(\)\s*=>\s*\{(.*?)\n\s*\},\s*\n\s*renderTopAuth:', s)
          checks = {
              'native_render_navigation': bool(nav),
              'no_dapur_global_key': not nav or not re.search(r"key\s*:\s*['\"]dapur['\"]", nav.group(1)),
              'no_dapur_global_label': not nav or not re.search(r"label\s*:\s*['\"]Dapur['\"]", nav.group(1)),
              'no_legacy_nav_marker': not nav or not re.search(r'adminDapurNav|fa-kitchen-set', nav.group(1)),
              'admin_dapur_runtime': Path('admin-dapur-creator-v5.js').exists(),
              'admin_user_route': Path('dapur-admin-user-route-v1.js').exists(),
              'admin_gudang_runtime': Path('admin-gudang-v2.js').exists(),
              'admin_ui_all_creator': ".eq('id',id).eq('managed_by_studihome',true)" not in Path('admin-dapur-ui.js').read_text(encoding='utf-8'),
              'dynamic_dapur_link': 'href="/dapur/${encodeURIComponent(creator.username || "")}"' in Path('admin-dapur-creator-v5.js').read_text(encoding='utf-8'),
              'no_legacy_position_file': not Path('admin-dapur-position.js').exists(),
              'no_legacy_admin_dapur_file': not Path('admin-dapur.js').exists(),
          }
          offenders=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.parts[0] in {'.git','node_modules'} or p.suffix.lower() not in {'.js','.html'} or p.name=='index.html':
                  continue
              txt=p.read_text(encoding='utf-8',errors='ignore')
              if 'top-nav-links' in txt and re.search(r'(?i)\bDapur\b',txt):
                  offenders.append(str(p))
          checks['no_dapur_header_injector_files'] = not offenders
          print('Dapur validation:', checks)
          if not all(checks.values()):
              raise SystemExit('Dapur architecture validation failed: ' + repr(checks))

      - name: Commit final source and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin-dapur-creator-v5.js admin-dapur-ui.js dapur-admin-user-route-v1.js
          git add -u
          git commit -m "feat: finalize per-creator Dapur routing and remove legacy header code"
          git rm .github/workflows/dapur-architecture-finalize.yml .github/workflows/dapur-architecture-dispatch.yml
          git commit -m "chore: remove one-shot Dapur architecture workflows"
          git push origin main
