name: One-shot boot hardening

on:
  push:
    branches: [main]
    paths:
      - 'supabase-config.js'
      - '.github/workflows/_fix-supabase-singleton-and-header.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical Supabase bootstrap
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {"
          new = "supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {"

          if old in s and "window.supabaseClient = supabaseClient;" not in s:
              s = s.replace(old, new, 1)
              marker = "            });\n        }"
              replacement = "            });\n            window.supabaseClient = supabaseClient;\n        }"
              if marker not in s:
                  raise SystemExit('Could not locate initSupabase closing marker.')
              s = s.replace(marker, replacement, 1)

          # Canonical global header must never contain Dapur/Creator as a top-level item.
          if 'admin-dapur.js' in s:
              raise SystemExit('Legacy /admin-dapur.js reference still exists in index.html; remove it before shipping.')

          p.write_text(s, encoding='utf-8')

      - name: Self remove this one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/_fix-supabase-singleton-and-header.yml

      - name: Commit boot hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_fix-supabase-singleton-and-header.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reuse Supabase singleton and harden global navigation'
          git push
