name: One-shot boot hardening

on:
  push:
    branches: [main]
    paths:
      - 'supabase-config.js'
      - '.github/workflows/_fix-supabase-singleton-and-header.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical Supabase bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r"supabaseClient\s*=\s*window\.supabase\.createClient\(SUPABASE_URL,\s*SUPABASE_ANON_KEY,\s*\{.*?\n\s*\}\);",
              re.S,
          )
          replacement = "supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {\n                auth: {\n                    persistSession: true,\n                    autoRefreshToken: true,\n                    detectSessionInUrl: true\n                }\n            });"

          if 'window.supabaseClient = supabaseClient;' not in s:
              s2, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Could not locate canonical initSupabase createClient block.')
              s = s2
              marker = "            });\n        }"
              if marker not in s:
                  raise SystemExit('Could not locate canonical initSupabase closing marker.')
              s = s.replace(marker, "            });\n            window.supabaseClient = supabaseClient;\n        }", 1)

          if 'admin-dapur.js' in s:
              raise SystemExit('Legacy /admin-dapur.js reference still exists in index.html.')

          p.write_text(s, encoding='utf-8')

      - name: Validate boot contract
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'window.supabaseClient = supabaseClient;' in s
          assert 'supabaseClient = window.supabaseClient || window.supabase.createClient' in s
          assert 'admin-dapur.js' not in s
          assert "label: 'Dapur'" not in s
          assert "label: 'Dapur Creator'" not in s
          print('Boot/navigation contract OK')

      - name: Self remove this one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/_fix-supabase-singleton-and-header.yml

      - name: Commit boot hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_fix-supabase-singleton-and-header.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reuse Supabase singleton and harden global navigation'
          git push
