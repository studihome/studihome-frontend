name: update-final-handoff

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sha = '9f27388690e984278b3d4ca4fcd16f1bb01c6288'
          dep = 'dpl_GfX5GYb1tKeCWHNtpbFjSfrqfZ9T'
          old = '77b86d44f9d442fb3913bef5b6a392994d6bfedd'
          olddep = 'dpl_CbPjWtFHn9djpWqyUr4jjHy8URy6'

          p = Path('MASTER_HANDOFF_PROMPT_STUDIHOME.md')
          s = p.read_text()
          s = s.replace(old, sha)
          s = s.replace(olddep, dep)
          s = s.replace('/tailwind-compiled.css?v=20260817r1', '/tailwind-compiled.css?v=20260817r2')
          s = s.replace('latest Production deployment is `READY` and matches the current commit SHA;', 'latest Production deployment is `READY` and matches the current commit SHA;')
          p.write_text(s)

          p = Path('PROJECT_CONSTITUTION.md')
          s = p.read_text()
          s = s.replace('a476d9efa7af207c871ad446af03e9520ff5811d', sha)
          s = s.replace('dpl_3B8o7xXgjXPXshYH8Qr3Spta8rFU', dep)
          s = s.replace('The final source immediately before this documentation commit is:', 'The final verified production source is:')
          if 'Production CSS contract' not in s:
              s += '\n\n## Article XIX — Current Production CSS & Auth Accessibility\n- Production homepage uses compiled Tailwind CSS; CDN runtime is prohibited.\n- Tailwind compilation preserves the base/preflight layer to maintain visual parity with the previously locked homepage.\n- Login email uses `autocomplete="username"`; password and registration fields use semantic autocomplete tokens.\n- Homepage hero visual contract remains locked; technical fixes must not redesign its markup or composition.\n'
          p.write_text(s)
          PY
          rm -f .github/workflows/update_final_handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_HANDOFF_PROMPT_STUDIHOME.md PROJECT_CONSTITUTION.md .github/workflows/update_final_handoff.yml
          git commit -m 'docs: sync handoff with verified production release'
          git push origin main
