name: One-time load final Dapur Creator contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'studihome' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Attach final Dapur Creator contract and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="/dapur-creator-final-contract.js?v=1"></script>'
          if marker not in text:
              needle = '</head>'
              if needle not in text:
                  raise SystemExit('index.html </head> marker not found; aborting safely.')
              text = text.replace(needle, f'    {marker}\n{needle}', 1)
              p.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/one-time-load-final-dapur-contract.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-load-final-dapur-contract.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finalize Dapur Creator navigation and actions"
          git push origin HEAD:main
