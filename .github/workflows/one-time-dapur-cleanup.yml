name: One-time Dapur navigation cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'studihome' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch canonical runtime and remove superseded navigation module
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('admin-dapur-creator-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          needle = '<a href="/${encodeURIComponent(creator.username)}" target="_blank" rel="noopener" class="px-3 py-2 rounded-xl bg-white border border-blue-100 text-[10px] font-bold text-[#151c75]">Lihat Profil</a>'
          replacement = needle + '\n              <button type="button" class="px-3 py-2 rounded-xl bg-blue-50 border border-blue-100 text-[10px] font-bold text-[#151c75]" onclick="window.AdminDapurCreatorRuntime.editProfile(\'${creatorId}\')"><i class="fa-solid fa-pen-to-square mr-1"></i>Kelola Profil</button>'
          if 'Kelola Profil' not in text:
              if needle not in text:
                  raise SystemExit('Runtime action marker not found; aborting safely.')
              text = text.replace(needle, replacement, 1)
              runtime.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = '<script src="/dapur-nav-governance.js?v=1" defer></script>\n'
          html = html.replace(old, '', 1)
          index.write_text(html, encoding='utf-8')

          legacy = Path('dapur-nav-governance.js')
          if legacy.exists():
              legacy.unlink()

          Path('.github/workflows/one-time-dapur-cleanup.yml').unlink()

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin-dapur-creator-runtime.js dapur-nav-governance.js .github/workflows/one-time-dapur-cleanup.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consolidate Dapur Creator navigation and remove legacy governance"
          git push origin HEAD:main
