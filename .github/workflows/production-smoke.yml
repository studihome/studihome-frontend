name: Studihome Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studihome-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: https://studihome.id
      SUPABASE_FUNCTIONS_URL: https://hbfmhwwxbgidsnljupca.supabase.co/functions/v1

    steps:
      - name: Wait for production alias SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            payload="$(curl -fsS --connect-timeout 5 --max-time 10               "$BASE_URL/api/version" 2>/dev/null || true)"

            actual_sha="$(PAYLOAD="$payload" python3 - <<'PY'
import json
import os

raw = os.environ.get('PAYLOAD', '')
try:
    payload = json.loads(raw)
except Exception:
    print('')
else:
    print(str(payload.get('commit') or '').strip().lower())
PY
)"

            if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              echo "Production alias matches $EXPECTED_SHA"
              exit 0
            fi

            echo "Production alias not ready (attempt $attempt/36, got: ${actual_sha:-none})"
            sleep 10
          done

          echo "::error::Production alias did not converge to $EXPECTED_SHA"
          exit 1

      - name: Public pages and security headers
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          curl -fsS --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 5 --max-time 15             -D "$tmp/root.headers" -o "$tmp/root.html"             "$BASE_URL/"

          tr -d '\r' < "$tmp/root.headers" > "$tmp/root.clean.headers"

          grep -qi '^strict-transport-security: max-age=31536000' "$tmp/root.clean.headers"
          grep -qi '^x-content-type-options: nosniff' "$tmp/root.clean.headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$tmp/root.clean.headers"
          grep -qi '^x-frame-options: DENY' "$tmp/root.clean.headers"
          grep -qi "^content-security-policy: frame-ancestors 'none';" "$tmp/root.clean.headers"
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' "$tmp/root.clean.headers"
          grep -q 'Studihome' "$tmp/root.html"

          for path in /privasi /ketentuan; do
            curl -fsS --retry 2 --retry-delay 2 --retry-all-errors               --connect-timeout 5 --max-time 15               -o /dev/null "$BASE_URL$path"
          done

          curl -fsS --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 5 --max-time 15             -D "$tmp/dapur.headers" -o "$tmp/dapur.html"             "$BASE_URL/dapur"

          tr -d '\r' < "$tmp/dapur.headers" > "$tmp/dapur.clean.headers"
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' "$tmp/dapur.clean.headers"
          grep -qi 'name="robots" content="noindex, nofollow, noarchive"' "$tmp/dapur.html"

      - name: Sitemap and public API smoke
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          curl -fsS --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 5 --max-time 15             "$BASE_URL/sitemap.xml" > "$tmp/sitemap.xml"

          SITEMAP_PATH="$tmp/sitemap.xml" python3 - <<'PY'
import os
import xml.etree.ElementTree as ET

path = os.environ['SITEMAP_PATH']
root = ET.parse(path).getroot()
ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
locs = [
    (node.text or '').strip()
    for node in root.findall('s:url/s:loc', ns)
]

if not root.tag.endswith('urlset'):
    raise SystemExit('Sitemap root is not urlset.')
if not locs:
    raise SystemExit('Sitemap contains no URLs.')
if len(locs) != len(set(locs)):
    raise SystemExit('Sitemap contains duplicate URLs.')

required = {
    'https://studihome.id/',
    'https://studihome.id/privasi',
    'https://studihome.id/ketentuan',
    'https://studihome.id/ai-video',
    'https://studihome.id/ai-automation',
    'https://studihome.id/ai-content',
}
missing = sorted(required.difference(locs))
if missing:
    raise SystemExit('Missing required sitemap URLs: ' + ', '.join(missing))

private_fragments = (
    '/admin',
    '/dapur',
    '/kamar',
    '/dashboard',
    '/creator-studio',
    '/ruang-kerja',
)
bad = [
    loc for loc in locs
    if any(fragment in loc for fragment in private_fragments)
]
if bad:
    raise SystemExit('Private URLs found in sitemap: ' + ', '.join(bad))

print(f'Sitemap smoke: PASS ({len(locs)} unique URLs)')
PY

          curl -fsS --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 5 --max-time 15             "$BASE_URL/api/agent-search" > "$tmp/agent.json"

          AGENT_PATH="$tmp/agent.json" python3 - <<'PY'
import json
import os

with open(os.environ['AGENT_PATH'], encoding='utf-8') as handle:
    payload = json.load(handle)

if payload.get('status') != 'success':
    raise SystemExit('Agent Search status is not success.')
if not isinstance(payload.get('results'), list):
    raise SystemExit('Agent Search results is not a list.')
if payload.get('count') != len(payload['results']):
    raise SystemExit('Agent Search count/result mismatch.')

print('Agent Search smoke: PASS')
PY

          curl -fsS --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 5 --max-time 15             "$BASE_URL/solusi/ai-video-untuk-umkm.md" > "$tmp/pseo.md"

          grep -q '^# Solusi Video dengan AI untuk UMKM' "$tmp/pseo.md"

      - name: Edge Function unauthenticated boundary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          for function_name in             send-email-verification             provision_managed_creators
          do
            code="$(curl -sS --connect-timeout 5 --max-time 15               -o "$tmp/${function_name}.body"               -w '%{http_code}'               -X POST               -H 'Content-Type: application/json'               --data '{}'               "$SUPABASE_FUNCTIONS_URL/$function_name")"

            if [ "$code" != "401" ]; then
              echo "::error::$function_name unauthenticated status was $code, expected 401"
              cat "$tmp/${function_name}.body" || true
              exit 1
            fi

            echo "$function_name unauthenticated boundary: PASS (401)"
          done

      - name: Version endpoint cache boundary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          curl -fsS --connect-timeout 5 --max-time 15             -D "$tmp/version.headers" -o "$tmp/version.json"             "$BASE_URL/api/version"

          tr -d '\r' < "$tmp/version.headers" > "$tmp/version.clean.headers"
          grep -qi '^cache-control: no-store, max-age=0' "$tmp/version.clean.headers"

          EXPECTED_SHA="${{ github.sha }}" VERSION_PATH="$tmp/version.json" python3 - <<'PY'
import json
import os

with open(os.environ['VERSION_PATH'], encoding='utf-8') as handle:
    payload = json.load(handle)

if payload.get('status') != 'ok':
    raise SystemExit('Version endpoint status is not ok.')
if payload.get('commit') != os.environ['EXPECTED_SHA']:
    raise SystemExit('Version endpoint SHA mismatch.')
if payload.get('environment') != 'production':
    raise SystemExit('Version endpoint is not reporting production.')

print('Version endpoint smoke: PASS')
PY
