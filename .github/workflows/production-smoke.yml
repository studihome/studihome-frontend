name: Studihome Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studihome-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SHA-aware production smoke
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://studihome.id
          SUPABASE_FUNCTIONS_URL: https://hbfmhwwxbgidsnljupca.supabase.co/functions/v1
        run: python3 scripts/production-smoke.py
