name: Wire creator profile features
on:
  push:
    branches: [feat/studio-ai-creator-card-dapur-profile-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire scripts and validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='<!-- STUDIHOME CREATOR PROFILE FEATURES -->'
          if marker not in text:
              if '</body>' not in text.lower(): raise SystemExit('Missing </body> marker')
              block='''<!-- STUDIHOME CREATOR PROFILE FEATURES -->\n<script src="/studio-ai-creator-card.js?v=1"></script>\n<script src="/dapur-profile-enhancements.js?v=1"></script>\n<!-- /STUDIHOME CREATOR PROFILE FEATURES -->\n'''
              text=re.sub(r'</body>',block+'</body>',text,count=1,flags=re.I)
              p.write_text(text,encoding='utf-8')
          for name in ('studio-ai-creator-card.js','dapur-profile-enhancements.js'):
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'Syntax check failed: {name}')
          if text.count('/studio-ai-creator-card.js')!=1 or text.count('/dapur-profile-enhancements.js')!=1:
              raise SystemExit('Unexpected script reference count')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/wire-creator-profile-features.yml
          git add index.html studio-ai-creator-card.js dapur-profile-enhancements.js
          git diff --cached --check
          git commit -m "feat: wire creator cards and dapur profile editor"
          git push