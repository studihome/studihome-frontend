<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Jadi Creator Studihome | Promo Produk Premium</title>
  <meta name="description" content="Ketentuan singkat menjadi Creator Studihome dan produk Premium yang sedang mendapat harga spesial.">
  <link rel="canonical" href="https://studihome.id/kamar?intent=creator">
  <meta name="theme-color" content="#151c75">
  <style>
    html, body { margin: 0; width: 100%; min-height: 100%; background: #EBF3FF; }
    iframe { display: block; width: 100%; height: 100dvh; min-height: 100vh; border: 0; }
  </style>
</head>
<body>
  <!--
    Creator promo intentionally reuses the production Lobby as the only visual shell.
    Header, footer, typography, spacing, product renderer and checkout remain owned by Lobby.
  -->
  <iframe id="lobby-app" src="/?creator=1" title="Studihome — Lobi Creator"></iframe>

  <script>
    (() => {
      'use strict';

      const frame = document.getElementById('lobby-app');
      const MAX_ATTEMPTS = 40;
      const RETRY_MS = 250;
      let attempts = 0;
      let rendered = false;

      const number = value => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };

      const discountPercent = product => {
        const original = number(product?.priceOriginal);
        const price = number(product?.price);
        return original > price && original > 0 ? ((original - price) / original) * 100 : 0;
      };

      function getLobby() {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          if (!win || !doc || !win.App?.state || !win.App?.products?.renderCardHTML) return null;
          if (win.location.origin !== window.location.origin) return null;
          return { win, doc };
        } catch (_) {
          return null;
        }
      }

      function getBestPremiumDeal(products) {
        return (Array.isArray(products) ? products : [])
          .filter(product => {
            if (!product || product.isFree === true) return false;
            const original = number(product.priceOriginal);
            const price = number(product.price);
            return original > 0 && price >= 0 && original > price;
          })
          .sort((a, b) => {
            const discountDiff = discountPercent(b) - discountPercent(a);
            if (discountDiff !== 0) return discountDiff;
            return number(a.price) - number(b.price);
          })[0] || null;
      }

      function renderCreatorView() {
        const lobby = getLobby();
        if (!lobby) return false;

        const { win, doc } = lobby;
        const main = doc.getElementById('main-content');
        const publicData = win.App.state.publicData;
        const product = getBestPremiumDeal(publicData?.products);

        if (!main || !publicData || !Array.isArray(publicData.products)) return false;

        const productHTML = product
          ? win.App.products.renderCardHTML(product)
          : `
              <div class="card-3d-inset p-6 rounded-2xl text-center">
                <div class="text-sm font-black text-[#151c75]">Belum ada promo Premium saat ini.</div>
                <p class="mt-1 text-xs text-slate-500">Cek lagi nanti untuk menemukan penawaran terbaik di Lobi.</p>
              </div>
            `;

        main.innerHTML = `
          <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
            <section class="max-w-2xl">
              <div class="text-[10px] font-black uppercase tracking-[.12em] text-amber-600">JADI CREATOR STUDIHOME</div>
              <h1 class="mt-2 text-2xl sm:text-4xl font-black leading-tight tracking-tight text-[#151c75]">Punya skill yang layak dibagikan?</h1>
              <p class="mt-3 text-sm leading-7 text-slate-600">Untuk membuka Dapur Creator, cukup miliki minimal satu produk Premium Studihome yang aktif. Setelah pembelian aktif, kamu bisa melanjutkan ke Kamar untuk menyiapkan profil Creator.</p>
              <p class="mt-2 text-xs leading-6 text-slate-500">Simpel saja: pilih produk Premium yang memang kamu butuhkan, selesaikan order seperti biasa di Lobi, lalu lanjutkan dari Kamar.</p>
            </section>

            <section class="mt-8 sm:mt-10">
              <div>
                <div class="text-[10px] font-black uppercase tracking-[.12em] text-amber-600">PILIHAN PREMIUM</div>
                <h2 class="mt-1 text-lg sm:text-2xl font-black text-[#151c75]">Ada yang lagi lebih hemat</h2>
                <p class="mt-1 text-xs leading-6 text-slate-500">Penawaran di bawah dipanggil langsung dari katalog Lobi. Tidak ada katalog atau checkout baru di halaman ini.</p>
              </div>

              <div class="mt-4 max-w-md">
                ${productHTML}
              </div>
            </section>
          </div>
        `;

        rendered = true;
        return true;
      }

      function boot() {
        if (rendered) return;
        attempts += 1;
        if (renderCreatorView()) return;
        if (attempts < MAX_ATTEMPTS) window.setTimeout(boot, RETRY_MS);
      }

      frame.addEventListener('load', boot, { once: true });
      window.setTimeout(boot, 150);
    })();
  </script>
</body>
</html>
