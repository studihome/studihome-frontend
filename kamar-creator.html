<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studihome</title>
  <meta name="description" content="Ketentuan singkat menjadi Creator Studihome dan pilihan produk Premium yang sedang promo.">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#EBF3FF}
    iframe{display:block;width:100%;height:100dvh;border:0}
  </style>
</head>
<body>
  <iframe id="lobby-app" src="/?creator=1" title="Studihome"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('lobby-app');
      const discount = p => {
        const original = Number(p?.priceOriginal || 0);
        const price = Number(p?.price || 0);
        return original > price ? ((original - price) / original) * 100 : 0;
      };

      function renderCreatorView() {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          if (!win || !doc || !win.App || !win.App.state) return false;

          const main = doc.getElementById('main-content');
          const data = win.App.state.publicData;
          if (!main || !data?.products) return false;

          const premiumPromo = (data.products || [])
            .filter(p => p && p.isFree !== true && Number(p.priceOriginal || 0) > Number(p.price || 0))
            .sort((a,b) => discount(b) - discount(a) || Number(a.price || 0) - Number(b.price || 0))
            .slice(0, 3);

          main.innerHTML = `
            <div class="max-w-7xl mx-auto px-3 sm:px-6 py-7 sm:py-10">
              <section class="mb-7 sm:mb-9">
                <div class="text-[10px] font-black uppercase tracking-[.12em] text-amber-600">JADI CREATOR STUDIHOME</div>
                <h1 class="text-2xl sm:text-4xl font-black text-[#151c75] mt-2 leading-tight">Punya skill yang layak dibagikan?</h1>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mt-2 max-w-2xl">Untuk membuka Dapur Creator, cukup miliki minimal satu produk Premium Studihome yang aktif. Setelah itu, kamu bisa menyiapkan profil, layanan, dan portfolio untuk ditinjau sebelum tampil ke publik.</p>
                <p class="text-[11px] sm:text-xs text-slate-500 leading-relaxed mt-2 max-w-2xl">Santai, nggak perlu ribet. Mulai dari satu produk Premium yang memang kamu butuhkan, lalu lanjutkan perjalananmu dari Kamar.</p>
              </section>

              <section>
                <div class="mb-4">
                  <div class="text-[10px] font-black uppercase tracking-[.12em] text-amber-600">PROMO PREMIUM</div>
                  <h2 class="text-lg sm:text-2xl font-black text-[#151c75] mt-1">Yang lagi paling menarik di Lobi</h2>
                  <p class="text-xs text-slate-500 mt-1">Produk ini diambil langsung dari katalog Lobi. Tampilan, tombol, dan alur belinya tetap milik Lobi.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                  ${premiumPromo.length
                    ? premiumPromo.map(p => win.App.products.renderCardHTML(p)).join('')
                    : `<div class="card-3d-inset p-6 rounded-2xl text-center text-xs text-slate-500 sm:col-span-2 lg:col-span-3">Belum ada produk Premium yang sedang diskon.</div>`}
                </div>
              </section>
            </div>
          `;

          return true;
        } catch (_) {
          return false;
        }
      }

      function boot() {
        if (renderCreatorView()) return;
        setTimeout(boot, 250);
      }

      frame.addEventListener('load', boot);
      setTimeout(boot, 500);
    })();
  </script>
</body>
</html>
